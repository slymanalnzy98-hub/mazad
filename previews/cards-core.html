<title>أجل كم: شاشات اللعب</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lalezar&family=Tajawal:wght@500;700;900&display=swap">
<style>
/* Layout: gallery of the core game screens in the approved "cards" look; each screen is a 16:9 TV frame, tabs switch between them in game order. Single light look by choice. */
:root{
  --wall:#ececf1; --mute:#66667a; --card:#ffffff;
  --bg:#f1edff; --ink:#1d1446; --red:#ff4f5e; --blue:#3a6bff; --green:#19b37a; --yellow:#ffc22e; --purple:#8a4dff; --soft:#e3dbff;
  --display:"Lalezar","Tajawal",sans-serif; --body:"Tajawal",Tahoma,sans-serif;
  color-scheme:light;
}
body{background:var(--wall);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
main{max-width:1180px;margin:0 auto;padding-block:24px 64px;display:flex;flex-direction:column;gap:22px}
h1{margin:0;font-size:1.9rem;font-weight:900}
header p{margin:4px 0 0;color:var(--mute)}
.tabs{display:flex;gap:10px;flex-wrap:wrap}
.tabs button{font:inherit;font-weight:700;border:2px solid var(--ink);background:var(--card);color:var(--ink);padding:8px 14px;border-radius:999px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--ink);color:#fff}
.tabs button:focus-visible{outline:3px solid var(--purple);outline-offset:2px}
.cap{font-weight:700;color:var(--mute);margin:0}

.tv{aspect-ratio:16/9;max-width:100%;border-radius:16px;overflow:hidden;position:relative;container-type:inline-size;display:flex;flex-direction:column;gap:1.6cqw;padding:2.4cqw 3cqw;box-sizing:border-box;box-shadow:0 14px 34px rgba(0,0,0,.18);background:var(--bg);font-family:var(--display)}
.tv::after{content:"";position:absolute;inset:auto -4cqw -10cqw auto;width:34cqw;height:34cqw;border-radius:50%;background:var(--soft);z-index:0}
.tv>*{position:relative;z-index:1}
.top{display:flex;justify-content:space-between;align-items:center;gap:2cqw}
.team{display:flex;flex-direction:column;gap:.3cqw;min-width:19cqw;background:#fff;border:.3cqw solid var(--ink);border-radius:1.4cqw;padding:.7cqw 1.6cqw;box-shadow:.5cqw .5cqw 0 var(--ink)}
.team .nm{font-family:var(--body);font-weight:900;font-size:1.8cqw}
.team .money{font-size:3.4cqw;line-height:1;font-variant-numeric:tabular-nums}
.t1 .money{color:var(--blue)} .t2 .money{color:var(--red)}
.kit{display:flex;gap:.7cqw;align-items:center;font-size:1.4cqw}
.life{width:2.8cqw;height:2.8cqw;display:grid;place-items:center;border-radius:50%;background:var(--bg);border:.2cqw solid var(--ink)}
.life.used{opacity:.25}
.steals{display:flex;gap:.4cqw;margin-inline-start:.4cqw}
.steals i{width:1.1cqw;height:1.1cqw;border-radius:50%;background:var(--blue)} .t2 .steals i{background:var(--red)}
.dim{opacity:.45}
.mid{text-align:center;display:flex;flex-direction:column;align-items:center;gap:.3cqw}
.logo{font-size:3.8cqw;line-height:1;transform:rotate(-3deg)} .logo span{color:var(--purple)}
.pill{font-family:var(--body);font-weight:700;font-size:1.6cqw;background:var(--ink);color:#fff;padding:.3cqw 1.6cqw;border-radius:999px}
.stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.6cqw;text-align:center}
.chip{display:inline-flex;gap:1cqw;align-items:center;font-size:2.2cqw;background:var(--yellow);border:.3cqw solid var(--ink);border-radius:1.2cqw;padding:.4cqw 2cqw;box-shadow:.4cqw .4cqw 0 var(--ink);transform:rotate(2deg)}
.chip small{font-family:var(--body);font-weight:700;font-size:1.5cqw}
.big{font-size:6cqw;line-height:1}
.mute{font-family:var(--body);font-weight:700;font-size:1.6cqw;color:#5d5385}

/* bid cards */
.bids{display:flex;gap:6cqw;align-items:flex-end}
.bid{width:19cqw;aspect-ratio:3/4;border:.4cqw solid var(--ink);border-radius:1.6cqw;box-shadow:.6cqw .6cqw 0 var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.6cqw;color:#fff;background:var(--k)}
.bid b{font-size:5.6cqw;line-height:1;text-shadow:.3cqw .3cqw 0 var(--ink);font-variant-numeric:tabular-nums}
.bid span{font-family:var(--body);font-weight:900;font-size:1.8cqw}
.bid.lead{transform:rotate(-4deg) translateY(-1.6cqw)}
.bid.lead::before{content:"الأعلى";position:absolute;transform:translateY(-15cqw);font-size:1.6cqw;background:var(--yellow);color:var(--ink);border:.25cqw solid var(--ink);border-radius:999px;padding:0 1.2cqw}
.bid{position:relative}
.bid.back{background:repeating-linear-gradient(45deg,var(--k) 0 1.2cqw,color-mix(in srgb,var(--k) 80%,#000) 1.2cqw 2.4cqw)}
.bid.back b{font-size:3cqw}
.call{font-size:3.4cqw;background:#fff;border:.35cqw solid var(--ink);border-radius:1.4cqw;padding:.4cqw 2.4cqw;box-shadow:.5cqw .5cqw 0 var(--ink);transform:rotate(-2deg)}
.call em{font-style:normal;color:var(--red)}
.timer{display:flex;align-items:center;gap:1cqw;font-size:2.6cqw}
.timer .ring{width:6cqw;height:6cqw;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--red) 70%,#fff 0);border:.3cqw solid var(--ink)}
.timer .ring b{width:4.4cqw;height:4.4cqw;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:2.4cqw}

/* question */
.q{font-family:var(--body);font-weight:900;font-size:3cqw;line-height:1.4;max-width:80%;background:#fff;border:.35cqw solid var(--ink);border-radius:1.6cqw;padding:1.2cqw 2.4cqw;box-shadow:.5cqw .5cqw 0 var(--ink)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:1.4cqw;width:80%}
.opt{display:flex;align-items:center;gap:1.4cqw;font-family:var(--body);font-weight:900;font-size:2.3cqw;background:#fff;border:.3cqw solid var(--ink);border-radius:1.2cqw;padding:.9cqw 1.4cqw;box-shadow:.4cqw .4cqw 0 var(--ink);text-align:start}
.opt i{font-style:normal;font-family:var(--display);width:3.6cqw;height:3.6cqw;flex:0 0 auto;display:grid;place-items:center;border-radius:.8cqw;color:#fff;background:var(--k);border:.25cqw solid var(--ink);font-size:2.2cqw}
.opt.gone{opacity:.25;text-decoration:line-through}
.helps{display:flex;gap:1.2cqw}
.help{font-family:var(--body);font-weight:900;font-size:1.6cqw;display:flex;gap:.6cqw;align-items:center;background:#fff;border:.3cqw solid var(--ink);border-radius:999px;padding:.3cqw 1.4cqw;box-shadow:.3cqw .3cqw 0 var(--ink)}
.help.used{opacity:.3;box-shadow:none}
.stake{font-family:var(--body);font-weight:900;font-size:1.6cqw}
.stake b{color:var(--green)} .stake s{color:var(--red);text-decoration:none}

/* result */
.res{font-size:9cqw;line-height:1;color:var(--green);text-shadow:.5cqw .5cqw 0 var(--ink);transform:rotate(-4deg)}
.flow{display:flex;align-items:center;gap:2cqw;font-size:3.4cqw;font-variant-numeric:tabular-nums}
.flow .from{color:#8f86b5}.flow .arrow{color:var(--purple)}.flow .to{color:var(--blue);font-size:4.6cqw}
.burst{position:absolute;inset:0;pointer-events:none;background-image:radial-gradient(circle,var(--yellow) 0 .6cqw,transparent .7cqw),radial-gradient(circle,var(--red) 0 .5cqw,transparent .6cqw),radial-gradient(circle,var(--blue) 0 .5cqw,transparent .6cqw),radial-gradient(circle,var(--green) 0 .5cqw,transparent .6cqw);background-size:13cqw 11cqw,17cqw 15cqw,11cqw 19cqw,9cqw 13cqw;background-position:0 0,4cqw 6cqw,8cqw 2cqw,2cqw 9cqw;opacity:.7}

/* steal */
.stealbar{font-size:4cqw;background:var(--red);color:#fff;border:.35cqw solid var(--ink);border-radius:1.4cqw;padding:.3cqw 3cqw;box-shadow:.5cqw .5cqw 0 var(--ink);transform:rotate(-2deg)}

.note{background:var(--card);border-radius:12px;padding:12px 16px;color:var(--mute);margin:0}
</style>

<main dir="rtl">
<header>
  <h1>أجل كم: شاشات اللعب</h1>
  <p>قلب اللعبة بأسلوب «البطاقات» اللي اخترته، بترتيب الجولة: المزايدة، ثم السؤال، ثم النتيجة، ثم السرقة. الأرقام أمثلة.</p>
</header>
<div class="tabs" role="tablist" id="tabs"></div>
<p class="cap" id="cap"></p>
<div id="screen"></div>
<p class="note" id="note"></p>
</main>

<script>
const team=(i,name,money,used,steals,dim)=>`<div class="team t${i} ${dim?'dim':''}"><span class="nm">${name}</span><span class="money">${money.toLocaleString('en')}</span>
  <span class="kit">${['📞','🔍','✂️'].map((e,k)=>`<span class="life ${used.includes(k)?'used':''}">${e}</span>`).join('')}<span class="steals">${'<i></i>'.repeat(steals)}</span></span></div>`;
const top=(mid,a,b)=>`<div class="top">${team(1,'الصقور',5600,[1],3,a)}<div class="mid">${mid}</div>${team(2,'النمور',4600,[],2,b)}</div>`;
const logo=`<span class="logo">أجل <span>كم؟</span></span>`;
const S={
  open:{t:'١. مزايدة علنية',cap:'الفريقين يزايدون قدام بعض من جهازهم أو من الشاشة. كل زيادة ترجّع العداد',note:'آخر 3 ثواني تطلع «مرة… مرتين… بيع!». البطاقة الأعلى ترتفع وتميل.',
    h:()=>`${top(logo+'<span class="pill">مزايدة علنية</span>')}<div class="stage">
      <span class="chip">علوم <small>· صعب · أقل شي 600</small></span>
      <div class="bids"><div class="bid lead" style="--k:var(--blue)"><b>1,200</b><span>الصقور</span></div><div class="bid" style="--k:var(--red)"><b>1,000</b><span>النمور</span></div></div>
      <div class="timer"><span class="ring"><b>3</b></span><span class="call">بيع… <em>مرة!</em></span></div></div>`},
  secret:{t:'٢. مزايدة سرية',cap:'كل فريق يكتب رقمه بالسر، والبطاقات مقلوبة لين يخلص الطرفين',note:'بعدها البطاقتين تنقلب مع بعض قدام الكل.',
    h:()=>`${top(logo+'<span class="pill">مزايدة سرية</span>')}<div class="stage">
      <span class="chip">أكلات شعبية <small>· وسط · أقل شي 400</small></span>
      <div class="bids"><div class="bid back" style="--k:var(--blue)"><b>✓ جاهزين</b><span>الصقور</span></div><div class="bid back" style="--k:var(--red)"><b>…</b><span>النمور يفكرون</span></div></div>
      <p class="mute">أول ما يجهز الطرفين، البطاقات تنقلب</p></div>`},
  q:{t:'٣. السؤال',cap:'الفريق اللي فاز بالمزايدة يجاوب، ومعه مساعداته',note:'المساعدة المستخدمة تبهت. الوقت حسب الصعوبة: 20 أو 25 أو 30 ثانية.',
    h:()=>`${top(logo+'<span class="pill">الصقور يجاوبون</span>',false,true)}<div class="stage">
      <p class="q">كم عدد عظام جسم الإنسان البالغ؟</p>
      <div class="opts">
        <div class="opt"><i style="--k:var(--red)">أ</i>186</div>
        <div class="opt"><i style="--k:var(--blue)">ب</i>206</div>
        <div class="opt gone"><i style="--k:var(--green)">ج</i>226</div>
        <div class="opt gone"><i style="--k:var(--yellow)">د</i>256</div>
      </div>
      <div class="helps"><span class="help">📞 اتصال</span><span class="help used">🔍 بحث</span><span class="help used">✂️ حذف</span></div>
      <div class="timer"><span class="ring"><b>18</b></span><span class="stake">صح <b>+2,400</b> · غلط <s>−1,200</s></span></div></div>`},
  win:{t:'٤. النتيجة',cap:'صح: ياخذون ضعف رهانهم، والفلوس تعدّ قدامهم',note:'لو غلطوا، تنتقل لشاشة السرقة.',
    h:()=>`<div class="burst"></div>${top(logo+'<span class="pill">علوم · صعب</span>')}<div class="stage">
      <p class="res">صح! +2,400</p>
      <div class="flow"><span class="from">5,600</span><span class="arrow">◀</span><span class="to">8,000</span></div>
      <p class="mute">الجواب: 206</p></div>`},
  steal:{t:'٥. السرقة',cap:'الفريق غلط، والثاني يقدر يسرق بـ10 ثواني وبدون مساعدات',note:'سرقة صح = نفس المبلغ. سرقة غلط = يخسرون نصه. ولكل فريق 3 سرقات بس.',
    h:()=>`${top(logo+'<span class="pill">النمور يسرقون</span>',true,false)}<div class="stage">
      <span class="stealbar">سرقة! 🏃‍♂️</span>
      <p class="q">كم عدد عظام جسم الإنسان البالغ؟</p>
      <div class="opts">
        <div class="opt gone"><i style="--k:var(--red)">أ</i>186</div>
        <div class="opt"><i style="--k:var(--blue)">ب</i>206</div>
        <div class="opt"><i style="--k:var(--green)">ج</i>226</div>
        <div class="opt"><i style="--k:var(--yellow)">د</i>256</div>
      </div>
      <div class="timer"><span class="ring"><b>7</b></span><span class="stake">صح <b>+1,200</b> · غلط <s>−600</s> · باقي لكم سرقتين</span></div></div>`}
};
const keys=Object.keys(S), tabs=document.getElementById('tabs');
tabs.innerHTML=keys.map(k=>`<button role="tab" data-k="${k}">${S[k].t}</button>`).join('');
function show(k){
  document.getElementById('screen').innerHTML=`<div class="tv">${S[k].h()}</div>`;
  document.getElementById('cap').textContent=S[k].cap;
  document.getElementById('note').textContent=S[k].note;
  tabs.querySelectorAll('button').forEach(b=>b.setAttribute('aria-selected',b.dataset.k===k));
}
tabs.onclick=e=>{const b=e.target.closest('button');if(b)show(b.dataset.k)};
show('open');
</script>
