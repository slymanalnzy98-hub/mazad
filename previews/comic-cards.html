<title>أجل كم: بطاقات الفئات</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800&display=swap">
<style>
/* Layout: the category picker panel as a grid of cards, matching the approved Figma card (art area on top, navy name bar, gold info button, red "remaining" ribbon). Drawings are comic stickers: thick black outlines, flat fills. Single light look by choice. */
:root{
  --panel:#f3f5fa; --art:#e3e9f6; --bar:#1f2a5a; --gold:#f2b233; --rib:#e5484d; --ribsh:#8e1f23; --ink:#1d1d1d; --page:#e6e9f0;
  --font:"Cairo",Tahoma,sans-serif;
  color-scheme:light;
}
body{margin:0;background:var(--page);color:var(--ink);font-family:var(--font);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
main{max-width:1000px;margin:0 auto;padding-block:28px 48px}
.panel{background:var(--panel);border-radius:28px;padding:40px 36px 44px;position:relative}
.panel h1{position:absolute;top:-22px;left:50%;transform:translateX(-50%);margin:0;background:var(--bar);color:#fff;font-size:1.4rem;font-weight:800;padding:4px 36px;border-radius:999px;white-space:nowrap}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:56px 40px;padding-top:20px}
@media (max-width:700px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:48px 24px}}
.card{position:relative;cursor:pointer;transition:transform .18s cubic-bezier(.3,1.6,.5,1)}
.card:hover{transform:translateY(-6px) rotate(-1deg)}
.card:focus-visible{outline:4px solid var(--gold);outline-offset:6px;border-radius:20px}
.body{border-radius:18px;overflow:hidden;background:#fff;box-shadow:0 6px 14px #0000001f}
.art{aspect-ratio:200/188;background:var(--art);position:relative;overflow:hidden;border-bottom:3px solid var(--ink)}
.art::before{content:"";position:absolute;width:85%;aspect-ratio:1;border-radius:50%;background:#ffffff59;left:-20%;top:-26%}
.art svg{position:absolute;inset:6% 6% 0;width:88%;height:94%}
.bar{background:var(--bar);color:#fff;text-align:center;font-weight:800;font-size:clamp(1rem,2.4vw,1.45rem);padding:.45em .3em .5em;line-height:1.2}
.info{position:absolute;top:-12px;inset-inline-end:-10px;width:40px;height:40px;border-radius:50%;background:var(--gold);border:3px solid #fff;display:grid;place-items:center;color:var(--bar);font:italic 800 1.4rem/1 Georgia,serif;box-shadow:0 2px 4px #0003;z-index:2}
.rib{position:absolute;top:-22px;left:50%;transform:translateX(-50%) rotate(-4deg);z-index:2;white-space:nowrap}
.rib span{display:block;background:var(--rib);color:#fff;font-weight:700;font-size:.95rem;padding:3px 18px;border-radius:6px;box-shadow:4px 4px 0 var(--ribsh)}
.rib i,.rib b{position:absolute;width:22px;height:22px;background:#fff;clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%);filter:drop-shadow(0 0 0 var(--gold))}
.rib i{top:-10px;right:-12px}.rib b{bottom:-12px;left:-12px}
.rib i::after,.rib b::after{content:"";position:absolute;inset:3px;background:var(--gold);clip-path:inherit}
.card.on .body{box-shadow:0 0 0 5px var(--gold),0 10px 20px #0003}
.card.on .bar{background:var(--gold);color:var(--bar)}
.art svg{animation:bob 3.2s ease-in-out infinite}
.card:nth-child(2n) .art svg{animation-delay:-1.4s}
@keyframes bob{50%{transform:translateY(-3%) rotate(-1.5deg)}}
@media (prefers-reduced-motion:reduce){.art svg{animation:none}.card{transition:none}}
.hint{margin:18px 4px 0;color:#59607a;font-weight:600}
</style>
