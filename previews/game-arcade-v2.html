<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>المزاد أركيد ٢</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lalezar&family=Press+Start+2P&family=IBM+Plex+Sans+Arabic:wght@700&display=swap">
<style>
:root{--ink:#fff;--k:#000;--y:#ffd23f;--pink:#ff4fa3;--cyan:#39f3ff;--green:#4ef08a;--purple:#a45cff;--a:#2f80ed;--b:#eb5757;--scr:#120f2e;--off:#2d2856;
--display:"Lalezar",Tahoma,sans-serif;--pixel:"Press Start 2P",monospace;--body:"IBM Plex Sans Arabic",Tahoma,sans-serif}
*{box-sizing:border-box}body{margin:0;background:#07060f;color:#fff;font-family:var(--body);padding:16px;display:flex;flex-direction:column;align-items:center;gap:12px}
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tabs button{font-family:var(--display);font-size:1.15rem;background:#000;color:#fff;border:3px solid #fff;box-shadow:4px 4px 0 var(--purple);padding:4px 18px;cursor:pointer}
.tabs button.on{background:var(--y);color:#000}
/* cabinet */
.cab{width:min(1120px,100%);background:linear-gradient(#2b2350,#1a1534);border:4px solid #000;box-shadow:10px 10px 0 #000;padding:14px;border-radius:10px}
.marq{display:flex;align-items:center;justify-content:center;gap:14px;background:#000;border:3px solid var(--purple);padding:6px;margin-bottom:12px;box-shadow:inset 0 0 18px rgba(164,92,255,.6)}
.marq b{font-family:var(--display);font-weight:400;font-size:2rem;line-height:1;color:var(--y);text-shadow:3px 3px 0 var(--pink)}
.marq i{width:10px;height:10px;background:var(--pink);animation:bl .5s steps(1) infinite}.marq i:nth-child(odd){animation-delay:.25s;background:var(--cyan)}
@keyframes bl{50%{opacity:.2}}
.scr{position:relative;aspect-ratio:16/9;min-height:560px;overflow:hidden;border:4px solid #000;border-radius:14px;
 background:radial-gradient(90% 70% at 50% 30%,#2a2470,var(--scr) 60%,#08061a)}
.scr::before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(2px 2px at 12% 18%,#fff 98%,transparent),radial-gradient(2px 2px at 82% 12%,var(--y) 98%,transparent),radial-gradient(2px 2px at 68% 34%,#fff 98%,transparent),radial-gradient(2px 2px at 30% 44%,var(--cyan) 98%,transparent),radial-gradient(2px 2px at 92% 50%,#fff 98%,transparent);animation:bl 1.4s steps(1) infinite}
.scr::after{content:"";position:absolute;inset-inline:0;bottom:0;height:24%;pointer-events:none;background:linear-gradient(rgba(255,79,163,.5) 2px,transparent 2px) 0 0/100% 20px,linear-gradient(90deg,rgba(255,79,163,.5) 2px,transparent 2px) 0 0/44px 100%;transform:perspective(220px) rotateX(58deg);transform-origin:bottom;-webkit-mask:linear-gradient(transparent,#000);mask:linear-gradient(transparent,#000);animation:fl 1s linear infinite}
@keyframes fl{to{background-position:0 20px,0 0}}
.ui{position:absolute;inset:0;z-index:1;display:flex;flex-direction:column;padding:16px 3.5% 20px;gap:12px}
/* HUD */
.hud{display:grid;grid-template-columns:1fr auto 1fr;align-items:stretch;gap:12px}
.pl{display:flex;align-items:center;gap:12px;background:#000;border:3px solid var(--c);box-shadow:5px 5px 0 var(--c);padding:8px 12px}
.pl.b{flex-direction:row-reverse}
.av{width:44px;height:44px;background:var(--c);display:grid;place-items:center;font-family:var(--display);font-size:1.6rem;border:3px solid #fff}
.pl div{flex:1;display:flex;flex-direction:column}.pl.b div{align-items:flex-end}
.pl small{font-family:var(--display);font-size:1.3rem;line-height:1}
.pl strong{font-family:var(--pixel);font-weight:400;font-size:1.1rem;color:var(--y);direction:ltr;margin-top:6px}
.pl.a{--c:var(--a)}.pl.b{--c:var(--b)}
.pl.dim{opacity:.45}
.mid{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-family:var(--pixel);font-size:.55rem;color:var(--cyan)}
.dots{display:flex;gap:4px}.dots i{width:10px;height:10px;background:var(--y)}.dots i.off{background:var(--off)}.dots i.now{background:var(--pink);animation:bl .5s steps(1) infinite}
.stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center}
.page{display:none}.page.on{display:flex}
/* category chip */
.cat{display:flex;align-items:center;gap:10px;font-family:var(--display);font-size:1.3rem;color:#000;background:var(--cyan);padding:2px 16px;box-shadow:4px 4px 0 #000;clip-path:polygon(8px 0,calc(100% - 8px) 0,100% 8px,100% calc(100% - 8px),calc(100% - 8px) 100%,8px 100%,0 calc(100% - 8px),0 8px)}
.who{font-family:var(--display);font-size:1.4rem;color:var(--y)}
/* question card with pixel corners */
.q{position:relative;background:#fff;color:#14112e;font-family:var(--display);font-size:clamp(1.6rem,3.4vw,2.5rem);line-height:1.4;padding:14px 34px;max-width:860px;
 clip-path:polygon(0 10px,10px 10px,10px 0,calc(100% - 10px) 0,calc(100% - 10px) 10px,100% 10px,100% calc(100% - 10px),calc(100% - 10px) calc(100% - 10px),calc(100% - 10px) 100%,10px 100%,10px calc(100% - 10px),0 calc(100% - 10px));
 filter:drop-shadow(6px 6px 0 var(--purple))}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:min(820px,100%)}
.opt{display:flex;align-items:center;gap:12px;padding:8px 12px 10px;font-family:var(--display);font-size:clamp(1.2rem,2.4vw,1.6rem);color:#fff;text-align:start;background:#1b173f;
 border:3px solid var(--c);box-shadow:inset 0 -5px 0 rgba(0,0,0,.4),4px 4px 0 #000;cursor:pointer;transition:transform .1s steps(2)}
.opt:hover{transform:translate(-2px,-2px)}
.opt i{font-style:normal;font-family:var(--pixel);font-size:.75rem;width:34px;height:34px;display:grid;place-items:center;background:var(--c);color:#000;flex:0 0 auto}
.opt:nth-child(1){--c:var(--y)}.opt:nth-child(2){--c:var(--cyan)}.opt:nth-child(3){--c:var(--pink)}.opt:nth-child(4){--c:var(--green)}
.opt.ok{background:var(--green);color:#000;border-color:#fff;animation:bl .3s steps(1) 4}
.opt.no{opacity:.25}
.foot{display:flex;align-items:center;gap:14px;font-family:var(--pixel);font-size:.6rem}
.foot .w{color:var(--green)}.foot .l{color:var(--pink)}
.tbar{display:flex;gap:3px}.tbar i{width:10px;height:18px;background:var(--y)}.tbar i.off{background:var(--off)}
.tnum{font-family:var(--pixel);font-size:1rem;background:var(--y);color:#000;padding:6px 8px;box-shadow:3px 3px 0 #000}
/* open auction */
.title{font-family:var(--display);font-size:clamp(2.6rem,7vw,4.6rem);line-height:1;color:var(--y);text-shadow:4px 4px 0 var(--pink),8px 8px 0 #000}
.sub{font-family:var(--pixel);font-size:.6rem;color:var(--cyan)}
.duel{display:flex;align-items:center;gap:clamp(20px,5vw,60px)}
.bid{display:flex;flex-direction:column;align-items:center;gap:6px}
.bid .p{width:clamp(120px,16vw,170px);aspect-ratio:1;background:var(--c);border:5px solid #fff;box-shadow:7px 7px 0 #000;display:grid;place-items:center;font-family:var(--pixel);font-size:clamp(1.2rem,2.6vw,1.8rem);transition:transform .15s steps(2)}
.bid .s{width:20px;height:50px;background:#8a5a2b;border:4px solid #000;border-top:0}
.bid em{font-style:normal;font-family:var(--display);font-size:1.3rem}
.bid.a{--c:var(--a)}.bid.b{--c:var(--b)}
.bid.lead .p{transform:translateY(-14px);outline:4px solid var(--y);outline-offset:4px}
.vs{font-family:var(--pixel);font-size:1.2rem;color:var(--pink)}
.log{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;font-family:var(--pixel);font-size:.55rem}
.log span{background:#000;border:2px solid var(--c);padding:5px 8px}
.going{font-family:var(--display);font-size:1.8rem;color:#000;background:var(--y);padding:0 18px;box-shadow:4px 4px 0 #000}
/* secret auction */
.envs{display:flex;gap:clamp(24px,6vw,80px)}
.env{display:flex;flex-direction:column;align-items:center;gap:8px;perspective:600px}
.card{width:clamp(150px,20vw,210px);aspect-ratio:1.35;position:relative;transform-style:preserve-3d;transition:transform .6s steps(6)}
.card>div{position:absolute;inset:0;backface-visibility:hidden;border:5px solid #fff;box-shadow:7px 7px 0 #000;display:grid;place-items:center}
.front{background:repeating-linear-gradient(45deg,var(--c) 0 12px,#000 12px 16px)}
.front::after{content:"?";font-family:var(--pixel);font-size:2.2rem;color:#fff;background:#000;padding:10px 14px;border:3px solid #fff}
.back{background:var(--c);transform:rotateY(180deg);font-family:var(--pixel);font-size:clamp(1.3rem,2.6vw,1.9rem)}
.env.open .card{transform:rotateY(180deg)}
.env.a{--c:var(--a)}.env.b{--c:var(--b)}
.env em{font-style:normal;font-family:var(--display);font-size:1.3rem}
.ready{font-family:var(--pixel);font-size:.55rem;color:var(--green)}
.ready.wait{color:var(--mute,#9a94c9);animation:bl .8s steps(1) infinite}
.reveal{font-family:var(--display);font-size:1.25rem;background:var(--pink);color:#fff;border:3px solid #fff;box-shadow:4px 4px 0 #000;padding:2px 20px;cursor:pointer}
@media(max-width:720px){.scr{aspect-ratio:auto;min-height:680px}.opts{grid-template-columns:1fr}.hud{grid-template-columns:1fr 1fr}.mid{display:none}.av{display:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<div class="tabs" id="tabs"><button data-p="open" class="on">مزايدة علنية</button><button data-p="secret">مزايدة سرية</button><button data-p="q">السؤال</button></div>
<div class="cab">
 <div class="marq"><i></i><i></i><i></i><b>المزاد</b><i></i><i></i><i></i></div>
 <div class="scr"><div class="ui">
  <div class="hud">
   <div class="pl a"><span class="av">ص</span><div><small>الصقور</small><strong>0800</strong></div></div>
   <div class="mid">ROUND 2/12<div class="dots"><i></i><i class="now"></i><i class="off"></i><i class="off"></i><i class="off"></i><i class="off"></i></div></div>
   <div class="pl b"><span class="av">ن</span><div><small>النمور</small><strong>1000</strong></div></div>
  </div>

  <div class="stage page on" id="open">
   <div class="cat">تقنية · مزايدة علنية</div>
   <div class="title">على كم؟</div>
   <div class="duel">
    <div class="bid a" id="ba"><div class="p" id="va">200</div><div class="s"></div><em>الصقور</em></div>
    <div class="vs">VS</div>
    <div class="bid b" id="bb"><div class="p" id="vb">250</div><div class="s"></div><em>النمور</em></div>
   </div>
   <div class="log" id="log"></div>
   <div class="going" id="going">بيع… مرة!</div>
  </div>

  <div class="stage page" id="secret">
   <div class="cat" style="background:var(--pink);color:#fff">رياضة · مزايدة سرية</div>
   <div class="title" style="font-size:clamp(2rem,5vw,3.4rem)">كل فريق يكتب رهانه بجواله</div>
   <div class="envs">
    <div class="env a" id="ea"><div class="card"><div class="front"></div><div class="back">400</div></div><em>الصقور</em><span class="ready">READY ✓</span></div>
    <div class="env b" id="eb"><div class="card"><div class="front"></div><div class="back">300</div></div><em>النمور</em><span class="ready wait">WAITING...</span></div>
   </div>
   <button class="reveal" id="rv">اكشف الرهانات</button>
  </div>

  <div class="stage page" id="q">
   <div class="who">النمور يجاوبون</div>
   <div class="q">أي شركة تصنع الآيفون؟</div>
   <div class="opts" id="opts"><button class="opt"><i>A</i>سامسونج</button><button class="opt"><i>B</i>أبل</button><button class="opt"><i>C</i>هواوي</button><button class="opt"><i>D</i>سوني</button></div>
   <div class="foot"><span class="w">WIN +300</span><span class="l">LOSE -300</span><span class="tbar"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i class="off"></i><i class="off"></i><i class="off"></i></span><span class="tnum">18</span></div>
  </div>
 </div></div>
</div>
<script>
const $=id=>document.getElementById(id);let T=[];const later=(f,ms)=>T.push(setTimeout(f,ms));const clear=()=>{T.forEach(clearTimeout);T=[]};
function go(p){clear();document.querySelectorAll(".page").forEach(x=>x.classList.toggle("on",x.id==p));document.querySelectorAll("#tabs button").forEach(b=>b.classList.toggle("on",b.dataset.p==p));
 if(p=="open")openRun();if(p=="secret"){$("ea").classList.remove("open");$("eb").classList.remove("open");const r=$("eb").querySelector(".ready");r.className="ready wait";r.textContent="WAITING...";later(()=>{r.className="ready";r.textContent="READY ✓"},1500)}
 if(p=="q")document.querySelectorAll(".opt").forEach(o=>o.classList.remove("ok","no"))}
function openRun(){let a=200,b=250;$("va").textContent=a;$("vb").textContent=b;$("log").innerHTML="";$("going").textContent="…";
 const steps=[["a",300],["b",350],["a",400]];steps.forEach(([w,v],i)=>later(()=>{$("v"+w).textContent=v;$("ba").classList.toggle("lead",w=="a");$("bb").classList.toggle("lead",w=="b");
  const s=document.createElement("span");s.style.setProperty("--c",w=="a"?"var(--a)":"var(--b)");s.textContent=(w=="a"?"SQR ":"NMR ")+v;$("log").appendChild(s)},800+i*1100));
 ["بيع… مرة!","بيع… مرتين!","بيع! للصقور بـ 400"].forEach((t,i)=>later(()=>$("going").textContent=t,4200+i*1000));later(openRun,8500)}
$("tabs").onclick=e=>{const p=e.target.dataset.p;if(p)go(p)};
$("rv").onclick=()=>{$("ea").classList.add("open");later(()=>$("eb").classList.add("open"),500)};
$("opts").onclick=e=>{const o=e.target.closest(".opt");if(!o)return;document.querySelectorAll(".opt").forEach((x,i)=>x.classList.add(i==1?"ok":"no"))};
openRun();
</script></body></html>
