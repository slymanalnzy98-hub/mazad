<title>أجل كم: شاشة الفئات</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800;900&display=swap">
<style>
/* Layout: a full TV screen. Deep navy stage with a soft spotlight and gold sparkles; a top bar (logo, round info, CTA); a 6x2 grid of trading-card style category cards; a bottom tray that fills as categories are picked. Cards: cream frame, sky art window with halftone, navy name plate with a gold rule. Drawings: comic stickers with thick outer line, thinner inner lines, halftone shade and a white sticker rim. Single dark look by choice. */
:root{
  --navy:#141d47; --navy2:#0c1333; --navy3:#22306b; --gold:#f5b82e; --gold2:#c98a10; --cream:#fff8ea; --sky:#dfe9fb; --sky2:#c7d6f3;
  --red:#e5484d; --red2:#8e1f23; --ink:#15151c; --green:#1f9d6b;
  --font:"Cairo",Tahoma,sans-serif;
  color-scheme:dark;
}
body{margin:0;background:#070b20;color:#fff;font-family:var(--font);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
main{max-width:1280px;margin:0 auto;padding-block:20px 40px;display:flex;flex-direction:column;gap:12px}
.hint{margin:0;color:#aab4d6;font-weight:600}

.tv{aspect-ratio:16/11.5;max-width:100%;border-radius:20px;overflow:hidden;position:relative;container-type:inline-size;display:flex;flex-direction:column;
  background:radial-gradient(70% 60% at 50% 38%,#26357a 0,var(--navy) 55%,var(--navy2) 100%);box-shadow:0 20px 50px #000a}
.tv::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.5;
  background:radial-gradient(1.6px 1.6px at 8% 22%,#f5b82e 99%,transparent),radial-gradient(1.4px 1.4px at 22% 78%,#fff 99%,transparent),radial-gradient(1.6px 1.6px at 78% 18%,#fff 99%,transparent),radial-gradient(1.8px 1.8px at 92% 64%,#f5b82e 99%,transparent),radial-gradient(1.4px 1.4px at 54% 90%,#fff 99%,transparent),radial-gradient(1.4px 1.4px at 38% 12%,#f5b82e 99%,transparent)}

.top{position:relative;z-index:2;display:flex;align-items:center;gap:2cqw;padding:1.4cqw 3cqw}
.logo{display:flex;align-items:center;gap:1cqw;font-weight:900;font-size:3cqw;line-height:1}
.logo .mk{width:3.6cqw;height:4.2cqw;border-radius:.8cqw;background:var(--gold);border:.3cqw solid var(--ink);box-shadow:.35cqw .35cqw 0 var(--ink);display:grid;place-items:center;color:var(--navy);font-size:2.4cqw;transform:rotate(-8deg)}
.logo b{color:var(--gold)}
.sp{flex:1}
.pill{font-weight:800;font-size:1.4cqw;border:.15cqw solid #ffffff40;border-radius:999px;padding:.3cqw 1.4cqw;color:#dfe6ff}
.cta{font-weight:900;font-size:1.6cqw;color:var(--navy);background:var(--gold);border:.25cqw solid var(--ink);border-radius:999px;padding:.35cqw 2cqw;box-shadow:.3cqw .3cqw 0 var(--ink)}

.head{position:relative;z-index:2;text-align:center;margin-top:-.4cqw}
.head h1{display:inline-block;margin:0;font-weight:900;font-size:2.4cqw;color:var(--navy);background:var(--gold);border:.25cqw solid var(--ink);border-radius:999px;padding:.1cqw 3cqw;box-shadow:.35cqw .35cqw 0 var(--ink);transform:rotate(-1.5deg)}

.grid{position:relative;z-index:2;flex:1;display:grid;grid-template-columns:repeat(6,1fr);gap:2.2cqw 1.6cqw;padding:2.6cqw 3.4cqw 1cqw;min-height:0}
.card{position:relative;display:flex;flex-direction:column;background:var(--cream);border:.3cqw solid var(--ink);border-radius:1.4cqw;padding:.55cqw;box-shadow:.45cqw .5cqw 0 var(--navy2);cursor:pointer;transition:transform .18s cubic-bezier(.3,1.6,.5,1);min-height:0}
.card:hover{transform:translateY(-.6cqw) rotate(-1.2deg)}
.card:focus-visible{outline:.4cqw solid var(--gold);outline-offset:.4cqw}
.win{flex:1;position:relative;border:.25cqw solid var(--ink);border-radius:.9cqw;overflow:hidden;min-height:0;
  background:radial-gradient(circle at 50% 120%,var(--sky2) 0 40%,transparent 41%),radial-gradient(var(--sky2) 22%,transparent 23%) 0 0/.9cqw .9cqw,var(--sky)}
.win svg{position:absolute;inset:4% 3% 0;width:94%;height:96%}
.plate{margin-top:.5cqw;background:var(--navy);border:.25cqw solid var(--ink);border-radius:.8cqw;color:#fff;font-weight:900;font-size:1.25cqw;text-align:center;padding:.35cqw .2cqw;position:relative;line-height:1.25}
.plate::before{content:"";position:absolute;inset:.25cqw .6cqw auto;height:.18cqw;background:var(--gold);border-radius:1cqw;opacity:.9}
.info{position:absolute;top:-1.1cqw;inset-inline-end:-1cqw;width:2.6cqw;height:2.6cqw;border-radius:50%;background:var(--gold);border:.25cqw solid var(--ink);display:grid;place-items:center;color:var(--navy);font:italic 900 1.5cqw/1 Georgia,serif;z-index:3;box-shadow:.2cqw .2cqw 0 var(--ink)}
.rib{position:absolute;top:-1.5cqw;left:50%;transform:translateX(-50%) rotate(-5deg);z-index:3;white-space:nowrap}
.rib span{display:block;background:var(--red);color:#fff;font-weight:800;font-size:1cqw;padding:.1cqw 1cqw;border:.2cqw solid var(--ink);border-radius:.4cqw;box-shadow:.3cqw .3cqw 0 var(--red2)}
.rib svg{position:absolute;width:1.7cqw;height:1.7cqw}.rib .s1{top:-.9cqw;right:-1cqw}.rib .s2{bottom:-1cqw;left:-1cqw}
.card.on{background:var(--gold);transform:translateY(-.5cqw) rotate(-1deg)}
.card.on .plate{background:var(--ink)}
.card.on::after{content:"✓";position:absolute;z-index:4;bottom:3cqw;inset-inline-start:-1cqw;width:2.6cqw;height:2.6cqw;border-radius:50%;background:var(--green);border:.25cqw solid var(--ink);color:#fff;display:grid;place-items:center;font-weight:900;font-size:1.5cqw;animation:pop .35s cubic-bezier(.3,1.8,.5,1)}
@keyframes pop{from{transform:scale(0)}}
.win svg{animation:bob 3.2s ease-in-out infinite;transform-origin:50% 90%}
.card:nth-child(2n) .win svg{animation-delay:-1.4s}.card:nth-child(3n) .win svg{animation-delay:-2.2s}
@keyframes bob{50%{transform:translateY(-3%) rotate(-1.5deg)}}

.tray{position:relative;z-index:2;display:flex;align-items:center;gap:1.4cqw;margin:0 3.4cqw 1.6cqw;background:#0c1333e6;border:.2cqw solid #ffffff22;border-radius:1.6cqw;padding:.8cqw 1.4cqw}
.tray .l{font-weight:900;font-size:1.5cqw;color:var(--gold)}
.slots{flex:1;display:flex;gap:.8cqw}
.slot{flex:1;height:3.4cqw;border:.2cqw dashed #5b6aa8;border-radius:.9cqw;display:grid;place-items:center;color:#5b6aa8;font-weight:900;font-size:1.6cqw}
.slot.f{border:.2cqw solid var(--ink);background:var(--cream);color:var(--navy);font-size:1.1cqw;font-weight:900;animation:pop .3s cubic-bezier(.3,1.8,.5,1)}
.go{font-family:inherit;font-weight:900;font-size:1.6cqw;color:var(--navy);background:var(--gold);border:.25cqw solid var(--ink);border-radius:1cqw;padding:.4cqw 2.4cqw;box-shadow:.3cqw .3cqw 0 var(--ink);cursor:pointer}
.go[disabled]{opacity:.4;cursor:default}
@media (prefers-reduced-motion:reduce){.win svg,.card.on::after,.slot.f{animation:none}.card{transition:none}}
</style>

</main>

<script>
const CATS=[['كورة سعودية','ball','باقي 23 لعبة'],['أكلات شعبية','food',''],['جغرافيا السعودية','desert','باقي 32 لعبة'],['علوم','sci',''],['ثقافة إسلامية','mosque','باقي 8 ألعاب'],['معلومات عامة','bulb','باقي 19 لعبة'],
  ['جغرافيا','globe',''],['تقنية','phone','باقي 12 لعبة'],['تاريخ السعودية','fort',''],['عواصم','city',''],['حيوانات','falcon','باقي 40 لعبة'],['رياضة عالمية','medal',''],
  ['لغة عربية','letter',''],['جسم الإنسان وصحة','heart','باقي 27 لعبة'],['شركات وعلامات','bag',''],['شعر وأدب','quill',''],['أفلام ومسلسلات','film','باقي 15 لعبة']];
const picked=[0,2,4];
const g=document.getElementById('grid');
g.innerHTML=CATS.map(([n,d,r],i)=>`<div class="card${picked.includes(i)?' on':''}" data-i="${i}" tabindex="0">
  ${r?`<div class="rib"><span>${r}</span><svg class="s1"><use href="#spark"/></svg><svg class="s2"><use href="#spark"/></svg></div>`:''}<span class="info">i</span>
  <div class="win"><svg viewBox="0 0 200 188" aria-hidden="true"><use href="#d-${d}"/></svg></div><div class="plate">${n}</div></div>`).join('');
function tray(){document.getElementById('slots').innerHTML=Array.from({length:5},(_,k)=>picked[k]===undefined?'<span class="slot">+</span>':`<span class="slot f">${CATS[picked[k]][0]}</span>`).join('');document.getElementById('go').disabled=picked.length<5}
g.addEventListener('click',e=>{const c=e.target.closest('.card');if(!c)return;const i=+c.dataset.i,a=picked.indexOf(i);if(a>=0)picked.splice(a,1);else if(picked.length<5)picked.push(i);c.classList.toggle('on',picked.includes(i));tray()});
tray();
</script>
