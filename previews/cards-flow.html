<title>أجل كم: رحلة الهوست</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lalezar&family=Tajawal:wght@500;700;900&display=swap">
<style>
/* Layout: gallery of the host journey in the approved "cards" look, in order from the start page to the winner; tabs switch screens, each a 16:9 frame. Single light look by choice. */
:root{
  --wall:#ececf1; --mute:#66667a; --card:#ffffff;
  --bg:#f1edff; --ink:#1d1446; --red:#ff4f5e; --blue:#3a6bff; --green:#19b37a; --yellow:#ffc22e; --purple:#8a4dff; --soft:#e3dbff;
  --display:"Lalezar","Tajawal",sans-serif; --body:"Tajawal",Tahoma,sans-serif;
  color-scheme:light;
}
body{background:var(--wall);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
main{max-width:1180px;margin:0 auto;padding-block:24px 64px;display:flex;flex-direction:column;gap:20px}
h1{margin:0;font-size:1.9rem;font-weight:900}
header p{margin:4px 0 0;color:var(--mute)}
.tabs{display:flex;gap:10px;flex-wrap:wrap}
.tabs button{font:inherit;font-weight:700;border:2px solid var(--ink);background:var(--card);color:var(--ink);padding:8px 14px;border-radius:999px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--ink);color:#fff}
.tabs button:focus-visible{outline:3px solid var(--purple);outline-offset:2px}
.cap{font-weight:700;color:var(--mute);margin:0}

.tv{aspect-ratio:16/9;max-width:100%;border-radius:16px;overflow:hidden;position:relative;container-type:inline-size;display:flex;flex-direction:column;gap:1.6cqw;padding:2.4cqw 3cqw;box-sizing:border-box;box-shadow:0 14px 34px rgba(0,0,0,.18);background:var(--bg);font-family:var(--display)}
.tv::after{content:"";position:absolute;inset:auto -4cqw -10cqw auto;width:34cqw;height:34cqw;border-radius:50%;background:var(--soft);z-index:0}
.tv>*{position:relative;z-index:1}
.logo{font-size:4cqw;line-height:1;transform:rotate(-3deg);display:inline-block} .logo span{color:var(--purple)}
.bigl{font-size:9cqw}
.row{display:flex;gap:1.6cqw;align-items:center;flex-wrap:wrap}
.btn{font-family:var(--display);font-size:2.2cqw;color:#fff;background:var(--k,var(--ink));border:.3cqw solid var(--ink);border-radius:1.2cqw;padding:.5cqw 2.4cqw;box-shadow:.45cqw .45cqw 0 var(--ink);cursor:pointer}
.btn.ghost{background:#fff;color:var(--ink)}
.btn:active{transform:translate(.3cqw,.3cqw);box-shadow:.1cqw .1cqw 0 var(--ink)}
.cardx{background:#fff;border:.3cqw solid var(--ink);border-radius:1.4cqw;box-shadow:.5cqw .5cqw 0 var(--ink);padding:1.2cqw 1.6cqw}
.body{font-family:var(--body);font-weight:700}
.h{font-size:3cqw;line-height:1.2}
.sub{font-family:var(--body);font-weight:700;font-size:1.7cqw;color:#5d5385}
@keyframes deal{from{transform:translateY(-24cqw) rotate(-18deg);opacity:0}}
@keyframes in{from{transform:scale(.5) rotate(-8deg);opacity:0}}
.deal>*{animation:deal .6s cubic-bezier(.2,1.3,.4,1) both}
.deal>*:nth-child(2){animation-delay:.08s}.deal>*:nth-child(3){animation-delay:.16s}.deal>*:nth-child(4){animation-delay:.24s}.deal>*:nth-child(5){animation-delay:.32s}.deal>*:nth-child(6){animation-delay:.4s}

/* start page */
.hero{display:grid;grid-template-columns:1.2fr 1fr;gap:3cqw;align-items:center;flex:1}
.fan{position:relative;height:30cqw}
.fan .c{position:absolute;width:15cqw;aspect-ratio:3/4;border:.35cqw solid var(--ink);border-radius:1.4cqw;box-shadow:.5cqw .5cqw 0 var(--ink);display:grid;place-items:center;color:#fff;font-size:4.4cqw;text-shadow:.3cqw .3cqw 0 var(--ink)}
.steps3{display:grid;grid-template-columns:repeat(3,1fr);gap:1.4cqw}
.steps3 .cardx{display:flex;flex-direction:column;gap:.4cqw;font-size:1.6cqw}
.steps3 b{font-size:2.6cqw;color:var(--k)}
.packs{display:grid;grid-template-columns:repeat(3,1fr);gap:1.6cqw}
.pack{display:flex;flex-direction:column;align-items:center;gap:.4cqw;text-align:center}
.pack .p{font-size:4cqw;color:var(--k)} .pack .n{font-size:2cqw}
.pack small{font-family:var(--body);font-weight:700;font-size:1.3cqw;color:#5d5385}
.pack.hot{transform:rotate(-2deg) scale(1.05);background:var(--yellow)}

/* categories */
.cats{display:grid;grid-template-columns:repeat(6,1fr);gap:1.2cqw;flex:1}
.cat{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.4cqw;font-size:1.7cqw;background:#fff;border:.3cqw solid var(--ink);border-radius:1.2cqw;box-shadow:.35cqw .35cqw 0 var(--ink);cursor:pointer;text-align:center;line-height:1.2;padding:.6cqw}
.cat i{font-style:normal;font-size:3cqw}
.cat.on{background:var(--k);color:#fff;transform:rotate(var(--r,-2deg)) translateY(-.4cqw)}
.counter{font-size:2.4cqw}

/* setup options */
.opts2{display:grid;grid-template-columns:1fr 1fr;gap:2cqw}
.choice{display:flex;flex-direction:column;gap:.6cqw;cursor:pointer;align-items:flex-start}
.choice .t{font-size:2.6cqw}
.choice .d{font-family:var(--body);font-weight:700;font-size:1.5cqw;color:#5d5385}
.choice.on{background:var(--k);color:#fff;transform:rotate(-1.5deg)}
.choice.on .d{color:#fff}
.lbl{font-size:2.2cqw}

/* join */
.join{display:grid;grid-template-columns:auto 1fr;gap:3cqw;align-items:center;flex:1}
.qr{width:22cqw;aspect-ratio:1;background:#fff;border:.4cqw solid var(--ink);border-radius:1.4cqw;box-shadow:.6cqw .6cqw 0 var(--ink);padding:1.2cqw;box-sizing:border-box}
.qr div{width:100%;height:100%;background:
  conic-gradient(var(--ink) 25%,#fff 0 50%,var(--ink) 0 75%,#fff 0) 0 0/20% 20%}
.code{font-size:6cqw;letter-spacing:.6cqw;direction:ltr}
.teams{display:grid;grid-template-columns:1fr 1fr;gap:1.6cqw}
.tbox{border-top:1.2cqw solid var(--k)}
.tbox .nm{font-size:2.4cqw}
.tbox .dev{font-family:var(--body);font-weight:700;font-size:1.5cqw}
.ok{color:var(--green)} .wait{color:#8f86b5}

/* final */
.podium{display:flex;gap:4cqw;align-items:flex-end;justify-content:center}
.pcard{width:24cqw;display:flex;flex-direction:column;align-items:center;gap:.4cqw;text-align:center}
.pcard .m{font-size:5cqw;color:var(--k)}
.pcard.win{transform:rotate(-3deg) scale(1.12);background:var(--yellow)}
.crown{font-size:5cqw;line-height:1}
.stats{display:flex;gap:1.4cqw;justify-content:center}
.stats .cardx{font-family:var(--body);font-weight:700;font-size:1.4cqw;text-align:center}
.stats b{display:block;font-family:var(--display);font-weight:400;font-size:2.4cqw}
.coin{position:absolute;top:-6cqw;width:3cqw;height:3cqw;border-radius:50%;background:var(--yellow);border:.3cqw solid var(--ink);z-index:3;animation:coin linear forwards}
@keyframes coin{to{transform:translateY(70cqw) rotate(540deg)}}
.note{background:var(--card);border-radius:12px;padding:12px 16px;color:var(--mute);margin:0}
@media (prefers-reduced-motion:reduce){.tv *{animation:none!important}}
</style>

<main dir="rtl">
<header>
  <h1>أجل كم: رحلة الهوست</h1>
  <p>من أول ما يفتح الموقع لين يطلع الفايز، بأسلوب «البطاقات». الأسعار والأرقام أمثلة للنقاش.</p>
</header>
<div class="tabs" role="tablist" id="tabs"></div>
<p class="cap" id="cap"></p>
<div id="screen"></div>
<p class="note" id="note"></p>
</main>

<script>
const $=id=>document.getElementById(id);
let timers=[];
const every=(ms,fn)=>{const id=setInterval(fn,ms);timers.push(id);return id};
const logo=c=>`<span class="logo ${c||''}">أجل <span>كم؟</span></span>`;
const CATS=[['⚽','كورة سعودية'],['🌍','جغرافيا'],['🍲','أكلات شعبية'],['🔬','علوم'],['💡','معلومات عامة'],['🏙️','عواصم'],['🐪','حيوانات'],['🏆','رياضة عالمية'],['📜','تاريخ السعودية'],['📱','تقنية'],['✍️','لغة عربية'],['🎬','أفلام ومسلسلات']];
const KS=['var(--red)','var(--blue)','var(--green)','var(--yellow)','var(--purple)'];
const S={
  home:{t:'١. صفحة البداية',cap:'أول شي يشوفه الهوست: وش اللعبة، وكيف تنلعب، والباقات',note:'زر «جرّب مجاناً» يسجّل الهوست ويعطيه لعبة مجانية.',
    h:()=>`<div class="hero">
      <div style="display:flex;flex-direction:column;gap:1.4cqw">
        ${logo('bigl')}
        <p class="h">زايد على السؤال… وفلّس الفريق الثاني 😏</p>
        <p class="sub">لعبة جمعات للأهل والربع. فريقين، وفلوس، ومزايدة على كل سؤال.</p>
        <div class="row"><button class="btn" style="--k:var(--purple)">جرّب مجاناً</button><button class="btn ghost">كيف تنلعب؟</button></div>
      </div>
      <div class="fan" id="fan">${[['600','var(--red)',-14,0],['1,200','var(--blue)',-4,8],['بيع!','var(--yellow)',8,16]].map(([t,k,r,x],i)=>`<div class="c" style="background:${k};transform:rotate(${r}deg);inset-inline-start:${x}cqw;top:${i*2}cqw;animation:deal .7s ${i*.15}s cubic-bezier(.2,1.3,.4,1) both">${t}</div>`).join('')}</div>
    </div>
    <div class="steps3 deal">
      <div class="cardx" style="--k:var(--red)"><b>١</b>تطلع الفئة، وتزايدون عليها</div>
      <div class="cardx" style="--k:var(--blue)"><b>٢</b>الأعلى يجاوب: صح ياخذ الضعف</div>
      <div class="cardx" style="--k:var(--green)"><b>٣</b>غلط؟ الفريق الثاني يسرق</div>
    </div>`},
  packs:{t:'٢. الباقات',cap:'تحت صفحة البداية، أو لما تخلص اللعبة المجانية',note:'الأسعار مثال للنقاش بس. نحددها بعد التجربة وحساب صافي الربح.',
    h:()=>`<div class="row" style="justify-content:space-between">${logo()}<span class="sub">أول لعبة علينا 🎁</span></div>
    <div class="packs deal" style="flex:1;align-items:center">
      <div class="cardx pack" style="--k:var(--blue)"><span class="n">لعبة وحدة</span><span class="p">٩ ريال</span><small>تجربة سريعة</small><button class="btn ghost">اختر</button></div>
      <div class="cardx pack hot" style="--k:var(--red)"><span class="n">٥ ألعاب</span><span class="p">٢٩ ريال</span><small>الأكثر طلباً</small><button class="btn" style="--k:var(--ink)">اختر</button></div>
      <div class="cardx pack" style="--k:var(--green)"><span class="n">شهر كامل</span><span class="p">٤٩ ريال</span><small>العب بلا حدود</small><button class="btn ghost">اختر</button></div>
    </div>`},
  cats:{t:'٣. اختيار الفئات',cap:'الهوست يختار 5 فئات، وتصير هي أعمدة اللوحة',note:'اضغط على أي فئة. أول ما تكمل 5 يتفعّل زر «تأكيد».',
    h:()=>`<div class="row" style="justify-content:space-between">${logo()}<span class="counter" id="cnt">اخترتوا 0 من 5</span></div>
    <div class="cats deal" id="cats">${CATS.map(([e,n],i)=>`<div class="cat" data-i="${i}" tabindex="0"><i>${e}</i>${n}</div>`).join('')}</div>
    <div class="row" style="justify-content:center"><button class="btn" id="go" style="--k:var(--purple);opacity:.4">تأكيد</button></div>`,
    run(){
      const on=[];
      $('cats').onclick=e=>{const c=e.target.closest('.cat');if(!c)return;const i=+c.dataset.i,at=on.indexOf(i);
        if(at>=0){on.splice(at,1);c.classList.remove('on');c.style.cssText=''}
        else if(on.length<5){on.push(i);c.classList.add('on');c.style.setProperty('--k',KS[on.length-1]);c.style.setProperty('--r',(on.length%2?-2:2)+'deg')}
        $('cnt').textContent=`اخترتوا ${on.length} من 5`;$('go').style.opacity=on.length===5?1:.4};
    }},
  mode:{t:'٤. طريقة اللعب',cap:'قبل البداية: كم جهاز، ووش نوع المزايدة',note:'جهاز واحد: كل شي من الشاشة. ٣ أجهزة: الشاشة + جهاز لكل فريق يزايد ويجاوب منه.',
    h:()=>`<div class="row" style="justify-content:space-between">${logo()}<span class="sub">خطوة أخيرة قبل اللعب</span></div>
    <div style="display:flex;flex-direction:column;gap:1.6cqw;flex:1;justify-content:center">
      <span class="lbl">كم جهاز عندكم؟</span>
      <div class="opts2 deal" data-g="dev">
        <div class="cardx choice on" style="--k:var(--blue)"><span class="t">📺 جهاز واحد</span><span class="d">الهوست يمسك الشاشة، والكل يقول رقمه بصوته</span></div>
        <div class="cardx choice" style="--k:var(--blue)"><span class="t">📺📱📱 ٣ أجهزة</span><span class="d">الشاشة، وجهاز لكل فريق يزايد منه</span></div>
      </div>
      <span class="lbl">المزايدة كيف؟</span>
      <div class="opts2 deal" data-g="bid">
        <div class="cardx choice on" style="--k:var(--red)"><span class="t">📢 علنية</span><span class="d">تزايدون قدام بعض، والأعلى ياخذها</span></div>
        <div class="cardx choice" style="--k:var(--red)"><span class="t">🤫 سرية</span><span class="d">كل فريق يكتب رقمه بالسر، وتنكشف مع بعض</span></div>
      </div>
    </div>
    <div class="row" style="justify-content:center"><button class="btn" style="--k:var(--purple)">يلا نبدأ</button></div>`,
    run(){document.querySelectorAll('.opts2').forEach(g=>g.onclick=e=>{const c=e.target.closest('.choice');if(!c)return;g.querySelectorAll('.choice').forEach(x=>x.classList.toggle('on',x===c))})}},
  join:{t:'٥. دخول الفرق',cap:'يطلع لما يختارون ٣ أجهزة: كل فريق يصوّر الكود بجهازه',note:'جهاز واحد لكل فريق بس، فما يقدر أحد ثاني يزايد عنهم. ولو اخترتوا جهاز واحد، هالشاشة ما تطلع.',
    h:()=>`<div class="row" style="justify-content:space-between">${logo()}<span class="sub">صوّروا الكود بجهاز كل فريق</span></div>
    <div class="join">
      <div class="qr"><div></div></div>
      <div style="display:flex;flex-direction:column;gap:1.6cqw">
        <span class="code">K7Q2X</span>
        <div class="teams deal">
          <div class="cardx tbox" style="--k:var(--blue)"><span class="nm">الصقور</span><span class="dev ok">✓ جوال فهد</span></div>
          <div class="cardx tbox" style="--k:var(--red)"><span class="nm">النمور</span><span class="dev wait" id="w">ننتظر جهاز…</span></div>
        </div>
        <button class="btn" id="st" style="--k:var(--purple);opacity:.4;align-self:flex-start">ابدأ اللعبة</button>
      </div>
    </div>`,
    run(){setTimeout(()=>{const w=$('w');if(!w)return;w.className='dev ok';w.textContent='✓ آيباد نورة';$('st').style.opacity=1},1800)}},
  over:{t:'٦. الفايز',cap:'آخر شاشة: الفايز، وإحصائيات تضحّك، وزر لعبة جديدة',note:'الإحصائيات تعطي لحظات تنصوّر وتنتشر: «أكبر سرقة»، و«أجرأ مزايدة».',
    h:()=>`<div class="row" style="justify-content:center">${logo()}</div>
    <div class="podium deal">
      <div class="cardx pcard win" style="--k:var(--blue)"><span class="crown">👑</span><span class="h">الصقور</span><span class="m" id="m1">0</span></div>
      <div class="cardx pcard" style="--k:var(--red)"><span class="h">النمور</span><span class="m">1,800</span></div>
    </div>
    <div class="stats deal">
      <div class="cardx">💸 أجرأ مزايدة<b>3,000 · النمور</b></div>
      <div class="cardx">🏃‍♂️ أكبر سرقة<b>1,200 · الصقور</b></div>
      <div class="cardx">📞 أنفع اتصال<b>أبو فهد</b></div>
    </div>
    <div class="row" style="justify-content:center"><button class="btn" style="--k:var(--purple)">لعبة جديدة</button><button class="btn ghost">شارك النتيجة</button></div>`,
    run(){const tv=$('screen').firstChild;for(let i=0;i<30;i++){const c=document.createElement('i');c.className='coin';c.style.left=Math.random()*96+'%';c.style.animationDuration=(1.3+Math.random()*1.5)+'s';c.style.animationDelay=(Math.random()*.9)+'s';tv.appendChild(c)}
      let k=0;every(40,()=>{if(k<40){k++;const m=$('m1');if(m)m.textContent=Math.round(9400*k/40).toLocaleString('en')}})}}
};
const keys=Object.keys(S),tabs=$('tabs');
tabs.innerHTML=keys.map(k=>`<button role="tab" data-k="${k}">${S[k].t}</button>`).join('');
function show(k){
  timers.forEach(clearInterval);timers=[];
  $('screen').innerHTML=`<div class="tv">${S[k].h()}</div>`;
  if(S[k].run)S[k].run();
  $('cap').textContent=S[k].cap;$('note').textContent=S[k].note;
  tabs.querySelectorAll('button').forEach(b=>b.setAttribute('aria-selected',b.dataset.k===k));
}
tabs.onclick=e=>{const b=e.target.closest('button');if(b)show(b.dataset.k)};
show('home');
</script>
