<title>المزاد</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lalezar&family=Press+Start+2P&family=IBM+Plex+Sans+Arabic:wght@500;700&display=swap">
<style>
/* Layout: one CRT "screen" that fills the page, built for a TV or laptop the whole majlis watches; stacks for phones. 80s arcade: pixel blocks, hard black shadows, Atari palette, scanlines. Single dark look by choice. */
:root{
  --room:#0d0d1f; --screen:#1b1b3a; --ink:#ffffff; --mute:#a9a9d6; --black:#000000; --off:#3b3b66;
  --blue:#2f80ed; --red:#eb5757; --yellow:#f2c94c; --green:#6fcf97; --green2:#27ae60; --purple:#9b51e0;
  --display:"Lalezar","IBM Plex Sans Arabic",Tahoma,sans-serif;
  --pixel:"Press Start 2P",ui-monospace,monospace;
  --body:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--room);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));box-sizing:border-box;
  background-image:linear-gradient(45deg,#14142c 25%,transparent 25%,transparent 75%,#14142c 75%),linear-gradient(45deg,#14142c 25%,transparent 25%,transparent 75%,#14142c 75%);background-size:32px 32px;background-position:0 0,16px 16px}
#wrap{max-width:1100px;margin:0 auto;padding-block:16px;min-height:100%;box-sizing:border-box;display:flex;flex-direction:column}
.crt{flex:1;background:#3a3a46;padding:12px;border:4px solid var(--black);box-shadow:8px 8px 0 var(--black);border-radius:6px;display:flex;flex-direction:column}
#app{flex:1;min-height:520px;background:radial-gradient(120% 120% at 50% 50%,#24244c,var(--screen) 60%,#101026);position:relative;overflow:hidden;display:flex;flex-direction:column;padding:clamp(14px,3vw,32px);box-sizing:border-box;border-radius:18px/24px;gap:16px}
#app::before{content:"";position:absolute;inset:0;pointer-events:none;z-index:0;
  background:
    repeating-linear-gradient(0deg,rgba(0,0,0,.22) 0 2px,transparent 2px 4px),
    radial-gradient(2px 2px at 12% 18%,#fff 98%,transparent),radial-gradient(2px 2px at 82% 12%,var(--yellow) 98%,transparent),
    radial-gradient(2px 2px at 68% 78%,#fff 98%,transparent),radial-gradient(2px 2px at 24% 70%,var(--green) 98%,transparent),
    radial-gradient(2px 2px at 92% 56%,#fff 98%,transparent),radial-gradient(2px 2px at 6% 48%,var(--red) 98%,transparent),
    radial-gradient(ellipse at center,transparent 60%,rgba(0,0,0,.5))}
#app::after{content:"";position:absolute;inset-inline:0;bottom:0;height:22%;pointer-events:none;z-index:0;
  background:linear-gradient(rgba(155,81,224,.45) 2px,transparent 2px) 0 0/100% 18px,linear-gradient(90deg,rgba(155,81,224,.45) 2px,transparent 2px) 0 0/40px 100%;
  transform:perspective(200px) rotateX(55deg);transform-origin:bottom;-webkit-mask-image:linear-gradient(transparent,#000);mask-image:linear-gradient(transparent,#000)}
.logo{text-shadow:7px 7px 0 var(--black),-4px -4px 0 var(--green2),0 0 40px rgba(111,207,151,.35)!important}
#app>*:not(.pix){position:relative;z-index:1}
.knobs{display:flex;justify-content:space-between;align-items:center;margin-top:10px;padding-inline:6px}
.knobs i{display:block;width:14px;height:14px;background:var(--black);border:3px solid #6c6c7a}
.knobs button{all:unset;cursor:pointer;font-family:var(--pixel);font-size:.55rem;color:#c9c9d6;padding:4px 6px}
.knobs button:focus-visible{outline:2px solid var(--yellow)}
p{margin:0}
h1,h2{margin:0;font-weight:400;font-family:var(--display);line-height:1.1}

.bar{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.team{border:4px solid var(--ink);padding:6px 14px;box-shadow:6px 6px 0 var(--black);display:flex;flex-direction:column;gap:4px;min-width:120px}
.team small{font-family:var(--display);font-size:1.25rem;line-height:1}
.team b{font-family:var(--pixel);font-size:clamp(.9rem,2vw,1.3rem);font-weight:400;font-variant-numeric:tabular-nums}
.team .tag{font-family:var(--pixel);font-size:.5rem;color:var(--yellow);min-height:.6rem}
.a{background:var(--blue)} .b{background:var(--red)}
.dim{opacity:.4}
.rd{font-family:var(--pixel);font-size:.6rem;color:var(--yellow);text-align:center;line-height:2;align-self:center}
.stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center}
.k{font-family:var(--display);font-size:clamp(1.1rem,2.4vw,1.6rem);color:var(--yellow)}
.cat{font-family:var(--display);font-size:clamp(3rem,10vw,6.5rem);line-height:1.1;color:var(--green);text-shadow:5px 5px 0 var(--black)}
.logo{font-size:clamp(4rem,14vw,9rem)}
.blink{animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.mute{color:var(--mute)}

button.px{font:inherit;font-family:var(--display);font-size:1.35rem;cursor:pointer;color:var(--black);background:var(--yellow);border:4px solid var(--ink);box-shadow:6px 6px 0 var(--black);padding:8px 26px;line-height:1.3}
button.px:active{transform:translate(4px,4px);box-shadow:2px 2px 0 var(--black)}
button.px.g{background:var(--green)} button.px.r{background:var(--red);color:var(--ink)} button.px.d{background:var(--black);color:var(--ink)}
button.px:disabled{opacity:.35;cursor:default}
button:focus-visible,input:focus-visible{outline:4px solid var(--purple);outline-offset:3px}
.row{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}

.names{display:grid;grid-template-columns:1fr 1fr;gap:14px;width:min(560px,100%)}
.names label{display:flex;flex-direction:column;gap:6px;font-family:var(--pixel);font-size:.55rem;color:var(--mute);text-align:start}
.names input{font:inherit;font-family:var(--display);font-size:1.6rem;color:var(--ink);border:4px solid var(--ink);box-shadow:5px 5px 0 var(--black);padding:6px 12px;min-width:0;width:100%;box-sizing:border-box;text-align:center}
.rules{list-style:none;margin:0;padding:0;max-width:640px;width:100%;display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:560px){.rules{grid-template-columns:1fr}}
.rules li{background:var(--black);border:4px solid var(--ink);box-shadow:5px 5px 0 var(--purple);padding:10px 14px;text-align:start;display:flex;gap:10px;align-items:center;font-size:1.15rem;font-weight:700;line-height:1.4}
.rules li i{flex:0 0 auto;width:14px;height:14px;background:var(--yellow);box-shadow:3px 3px 0 var(--purple)}

.betbox{background:var(--black);border:4px solid var(--ink);box-shadow:6px 6px 0 var(--purple);padding:18px;display:flex;flex-direction:column;gap:14px;align-items:center;width:min(460px,100%);box-sizing:border-box}
.amount{font-family:var(--pixel);font-size:clamp(1.8rem,6vw,3rem);color:var(--green);text-shadow:4px 4px 0 var(--purple)}
.meter{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;width:100%}
.meter i{height:16px;background:var(--green);box-shadow:2px 2px 0 var(--purple)}
.meter i.off{background:var(--off);box-shadow:none}
.chips{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:100%}
.chips button{font-family:var(--pixel);font-size:.6rem;color:var(--ink);background:var(--screen);border:3px solid var(--ink);padding:10px 0;cursor:pointer}
.hidebid{font-family:var(--pixel);font-size:1.6rem;color:var(--mute);letter-spacing:.3em}

.paddles{display:flex;gap:clamp(30px,8vw,90px);align-items:flex-end;justify-content:center}
.paddle{display:flex;flex-direction:column;align-items:center}
.paddle .p{width:clamp(100px,16vw,160px);aspect-ratio:1;display:grid;place-items:center;font-family:var(--pixel);font-size:clamp(1rem,2.6vw,1.6rem);border:5px solid var(--ink);box-shadow:7px 7px 0 var(--black)}
.paddle .s{width:22px;height:60px;background:#8a5a2b;border:4px solid var(--black);border-top:0}
.paddle em{font-style:normal;font-family:var(--display);font-size:1.3rem;margin-top:6px}
.paddle.win .p{animation:raise .5s steps(2) infinite alternate}
@keyframes raise{to{transform:translateY(-14px)}}
.paddle.lose{opacity:.45}

.q{font-family:var(--display);font-size:clamp(1.4rem,3.4vw,2.3rem);line-height:1.4;max-width:900px;background:var(--black);border:4px solid var(--ink);padding:12px 22px;box-shadow:7px 7px 0 var(--purple)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:16px;width:min(860px,100%)}
@media (max-width:560px){.opts{grid-template-columns:1fr}.names{grid-template-columns:1fr}}
.opt{display:flex;align-items:center;gap:12px;border:4px solid var(--ink);box-shadow:6px 6px 0 var(--black);padding:10px 14px;font-family:var(--display);font-size:clamp(1.2rem,2.6vw,1.7rem);text-align:start;color:var(--black);cursor:pointer;font-weight:400}
.opt i{font-style:normal;font-family:var(--pixel);font-size:.8rem;background:var(--black);color:var(--ink);width:36px;height:36px;display:grid;place-items:center;flex:0 0 auto}
.opt:disabled{cursor:default}
.opt.gone{opacity:.15}
.opt.right{outline:6px solid var(--green);outline-offset:4px}
.opt.wrong{outline:6px solid var(--red);outline-offset:4px;opacity:.5}
.tm{display:flex;align-items:center;gap:10px}
.tm b{font-family:var(--pixel);font-weight:400;font-size:1.1rem;background:var(--yellow);color:var(--black);padding:8px 10px;box-shadow:5px 5px 0 var(--black);min-width:2.4em;text-align:center}
.bars{display:flex;gap:4px}
.bars i{width:12px;height:24px;background:var(--yellow);box-shadow:2px 2px 0 var(--black)}
.bars i.off{background:var(--off);box-shadow:none}
.stake{font-family:var(--pixel);font-size:.65rem;color:var(--yellow);line-height:2}
.big{font-family:var(--pixel);font-size:clamp(2.2rem,8vw,4.6rem);text-shadow:6px 6px 0 var(--black)}
.alarm{background:var(--red)!important}
.steal{font-family:var(--display);font-size:1.6rem;background:var(--purple);border:4px solid var(--ink);padding:4px 18px;box-shadow:6px 6px 0 var(--black)}
.final{display:flex;gap:30px;flex-wrap:wrap;justify-content:center}
.count{font-family:var(--pixel);font-size:clamp(5rem,18vw,11rem);color:var(--yellow);text-shadow:8px 8px 0 var(--black);animation:zoom .9s steps(4) both}
@keyframes zoom{from{transform:scale(2.2);opacity:0}40%{opacity:1}to{transform:scale(1)}}
.roll{filter:blur(.5px);opacity:.85}
.land{animation:land .35s steps(3) both}
@keyframes land{from{transform:scale(1.4)}to{transform:scale(1)}}
.shake{animation:shake .45s steps(6)}
@keyframes shake{20%{transform:translate(-10px,4px)}40%{transform:translate(9px,-5px)}60%{transform:translate(-7px,3px)}80%{transform:translate(5px,-2px)}}
.flash::before{animation:flash .5s steps(3)}
@keyframes flash{0%,60%{background-color:rgba(111,207,151,.35)}}
.pop{animation:land .3s steps(3)}
.pix{position:absolute;width:12px;height:12px;z-index:3;pointer-events:none;animation:fallpx linear forwards}
@keyframes fallpx{to{transform:translateY(110vh) rotate(180deg)}}
@media (prefers-reduced-motion:reduce){.blink,.paddle.win .p,.count,.land,.shake,.pop,.pix{animation:none}.pix{display:none}}
</style>

<div id="wrap" dir="rtl">
  <div class="crt">
    <div id="app"></div>
    <div class="knobs"><i></i><button id="snd" type="button">SOUND: ON</button><button id="quit" type="button">MENU</button><i></i></div>
  </div>
</div>

<script>
const app=document.getElementById('app');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const fmt=n=>String(n);

/* ---------- صوت أركيد بسيط ---------- */
let sound=true, ac=null;
function beep(f=600,d=.08,type='square',v=.06){
  if(!sound)return;
  try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();
    o.type=type;o.frequency.value=f;g.gain.value=v;o.connect(g);g.connect(ac.destination);o.start();
    g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+d);o.stop(ac.currentTime+d+.02)}catch(e){}
}
const tune=(notes,step=.09)=>notes.forEach((f,i)=>setTimeout(()=>beep(f,step*.9),i*step*1000));
const SFX={tap:()=>beep(520,.05),win:()=>tune([523,659,784,1046]),lose:()=>tune([392,330,262,196],.12),tick:()=>beep(880,.03,'square',.03),reveal:()=>tune([300,400,500,700],.07)};
document.getElementById('snd').onclick=e=>{sound=!sound;e.target.textContent='SOUND: '+(sound?'ON':'OFF');SFX.tap()};
document.getElementById('quit').onclick=()=>{stopTimer();title()};

/* ---------- الأسئلة: [سؤال, [خيارات], رقم الصح] ---------- */
const BANK={
 "كورة سعودية":[
  ["أي نادي فاز بأول نسخة من دوري المحترفين السعودي (2008–2009)؟",["الهلال","الاتحاد","النصر","الشباب"],1],
  ["في أي سنة فاز المنتخب السعودي بأول كأس آسيا؟",["1984","1988","1996","2007"],0],
  ["أي منتخب فازت عليه السعودية 2–1 في كأس العالم 2022؟",["المكسيك","بولندا","الأرجنتين","فرنسا"],2],
  ["ملعب «الجوهرة المشعة» في أي مدينة؟",["الرياض","الدمام","جدة","أبها"],2]],
 "جغرافيا":[
  ["وش اسم أكبر صحراء رملية متصلة في العالم؟",["النفود","الربع الخالي","الدهناء","الصحراء الكبرى"],1],
  ["عاصمة أستراليا؟",["سيدني","ملبورن","كانبرا","بيرث"],2],
  ["كم عدد القارات المتعارف عليها؟",["5","6","7","8"],2],
  ["أي بحر يطل على غرب المملكة؟",["الخليج العربي","البحر الأحمر","بحر العرب","البحر المتوسط"],1]],
 "أكلات شعبية":[
  ["الكليجا مشهورة في أي منطقة؟",["القصيم","جازان","الشرقية","تبوك"],0],
  ["المندي أصله من أي بلد؟",["مصر","اليمن","المغرب","العراق"],1],
  ["المكوّن الأساسي في الجريش؟",["الرز","العدس","القمح","الذرة"],2],
  ["اللقيمات تنقلى وبعدها تتغمّس عادة في؟",["الملح","الدبس أو الشيرة","الخل","الزيت"],1]],
 "علوم":[
  ["أي كوكب يسمّونه الكوكب الأحمر؟",["الزهرة","المريخ","زحل","عطارد"],1],
  ["كم عدد عظام جسم الإنسان البالغ؟",["186","206","226","256"],1],
  ["أسرع حيوان بري؟",["الأسد","الحصان","الفهد","الغزال"],2],
  ["الماء يتكوّن من هيدروجين و…؟",["كربون","نيتروجين","أكسجين","هيليوم"],2]],
 "تقنية":[
  ["مين أسس مايكروسوفت مع بول ألن؟",["ستيف جوبز","بيل غيتس","إيلون ماسك","مارك زوكربيرغ"],1],
  ["أي شركة تصنع الآيفون؟",["سامسونج","أبل","هواوي","سوني"],1],
  ["كم بايت في الكيلوبايت بالحساب التقليدي؟",["100","1000","1024","2048"],2],
  ["أي لغة برمجة شعارها ثعبان؟",["جافا","بايثون","روبي","سي"],1]],
 "تاريخ السعودية":[
  ["في أي سنة ميلادية توحّدت المملكة باسمها الحالي؟",["1902","1925","1932","1953"],2],
  ["اليوم الوطني السعودي في أي يوم؟",["22 فبراير","23 سبتمبر","2 ديسمبر","1 يناير"],1],
  ["يوم التأسيس في أي يوم؟",["22 فبراير","23 سبتمبر","10 مارس","5 يونيو"],0],
  ["مين أول رائد فضاء عربي ومسلم؟",["سلطان بن سلمان","محمد فارس","ريانة برناوي","علي القرني"],0]],
 "معلومات عامة":[
  ["عملة اليابان؟",["اليوان","الوون","الين","الروبية"],2],
  ["عاصمة كندا؟",["تورنتو","أوتاوا","مونتريال","فانكوفر"],1],
  ["كم ضلع للشكل السداسي؟",["5","6","7","8"],1],
  ["كم دقيقة في 3 ساعات؟",["120","150","180","200"],2]],
 "عواصم":[
  ["عاصمة البرازيل؟",["ريو دي جانيرو","ساو باولو","برازيليا","سلفادور"],2],
  ["عاصمة تركيا؟",["إسطنبول","أنقرة","إزمير","بورصة"],1],
  ["عاصمة المغرب؟",["الدار البيضاء","مراكش","فاس","الرباط"],3],
  ["عاصمة سويسرا؟",["زيورخ","جنيف","برن","بازل"],2]],
 "حيوانات":[
  ["أكبر حيوان على وجه الأرض؟",["الفيل الأفريقي","الحوت الأزرق","القرش الأبيض","الزرافة"],1],
  ["كم رجل للعنكبوت؟",["6","8","10","12"],1],
  ["وش الحيوان اللي يسمونه «سفينة الصحراء»؟",["الحصان","الجمل","الحمار","الغزال"],1],
  ["وش اسم صغير الأسد؟",["الجرو","المهر","الشبل","الحوار"],2]],
 "رياضة عالمية":[
  ["كم لاعب لكل فريق داخل ملعب كرة القدم؟",["9","10","11","12"],2],
  ["وين أقيم كأس العالم 2022؟",["روسيا","قطر","البرازيل","أمريكا"],1],
  ["بطولة ويمبلدون في أي رياضة؟",["الغولف","التنس","السباحة","الملاكمة"],1],
  ["كم دقيقة وقت مباراة كرة القدم الأصلي؟",["60","80","90","120"],2]],
 "لغة عربية":[
  ["كم عدد حروف الهجاء العربية؟",["26","27","28","29"],2],
  ["جمع كلمة «كتاب»؟",["كتابات","كُتُب","كتّاب","مكاتب"],1],
  ["وش معنى «الليث»؟",["الذئب","النمر","الأسد","الصقر"],2],
  ["وش معنى «الغيث»؟",["الريح","المطر","البرق","الغيم"],1]]
};

/* ---------- حالة اللعبة ---------- */
const ROUNDS=12, START=1000, MINBET=50, ANSWER_S=20, STEAL_S=10;
let G=null, T=null;
function stopTimer(){clearInterval(T);T=null}

function header(active){
  const t=i=>{const tm=G.teams[i];return `<div class="team ${i?'b':'a'} ${active!==undefined&&active!==i?'dim':''}"><small>${esc(tm.name)}</small><b>${fmt(tm.coins)}</b><span class="tag">${tm.allin?'':'ALL-IN ×1'}</span></div>`};
  return `<div class="bar">${t(0)}<div class="rd">ROUND ${G.round}/${ROUNDS}</div>${t(1)}</div>`;
}

function title(){
  app.innerHTML=`<div class="stage">
    <h1 class="cat logo">المزاد</h1>
    <p class="k blink">PRESS START</p>
    <div class="names">
      <label>TEAM 1<input id="n1" class="a" value="${esc(G?G.teams[0].name:'الصقور')}" maxlength="12" autocomplete="off"></label>
      <label>TEAM 2<input id="n2" class="b" value="${esc(G?G.teams[1].name:'النمور')}" maxlength="12" autocomplete="off"></label>
    </div>
    <ul class="rules">
      <li><i></i>${START} عملة لكل فريق، و${ROUNDS} سؤال</li>
      <li><i></i>راهن بالسر، والأعلى يجاوب</li>
      <li><i></i>صح تكسب، غلط تخسر والخصم يسرق</li>
      <li><i></i>«كل شي أو لا شي» مرة وحدة</li>
    </ul>
    <button class="px g" id="go">ابدأ</button></div>`;
  document.getElementById('go').onclick=()=>{
    SFX.win();
    const n1=document.getElementById('n1').value.trim()||'الصقور', n2=document.getElementById('n2').value.trim()||'النمور';
    const deck=[];Object.entries(BANK).forEach(([c,qs])=>shuffle(qs).forEach(q=>deck.push([c,...q])));
    G={teams:[{name:n1,coins:START,allin:false},{name:n2,coins:START,allin:false}],round:0,deck:shuffle(deck),bids:[0,0],allin:[false,false]};
    nextRound();
  };
}

function nextRound(){
  stopTimer();
  if(G.round>=ROUNDS)return gameOver();
  G.round++;
  // اختر سؤال من فئة ما تكررت آخر مرة
  let i=G.deck.findIndex(q=>q[0]!==G.lastCat); if(i<0)i=0;
  G.cur=G.deck.splice(i,1)[0]; G.lastCat=G.cur[0];
  G.teams.forEach(t=>{if(t.coins<=0){t.coins=100;t.rescued=true}});
  G.bids=[null,null];G.allin=[false,false];
  app.innerHTML=`${header()}<div class="stage"><p class="k">الفئة الجاية</p><p class="cat roll" id="cat">؟</p>
    ${G.teams.some(t=>t.rescued)?`<p class="mute">${G.teams.filter(t=>t.rescued).map(t=>esc(t.name)).join(' و ')} أفلسوا، وعطيناهم 100 عملة يكملون فيها.</p>`:''}
    <button class="px" id="b" disabled>ابدأ المزاد</button></div>`;
  G.teams.forEach(t=>t.rescued=false);
  const el=document.getElementById('cat'), cats=Object.keys(BANK); let n=0;
  stopTimer();
  T=setInterval(()=>{el.textContent=cats[n++%cats.length];beep(300+(n%5)*80,.04,'square',.03);
    if(n>=14){stopTimer();el.textContent=G.cur[0];el.classList.remove('roll');el.classList.add('land');SFX.reveal();document.getElementById('b').disabled=false;document.getElementById('b').focus()}},90);
  document.getElementById('b').onclick=()=>bet(0);
}

function bet(i){
  const t=G.teams[i], other=G.teams[1-i];
  let v=Math.min(Math.max(MINBET,Math.round(t.coins*.2/50)*50),t.coins), all=false;
  app.innerHTML=`${header(i)}<div class="stage">
    <p class="k">${esc(t.name)} يراهنون · ${esc(other.name)} لا يطالعون 🙈</p>
    <p class="mute">الفئة: <b style="color:var(--green)">${esc(G.cur[0])}</b></p>
    <div class="betbox">
      <p class="amount" id="amt"></p>
      <div class="meter" id="mt"></div>
      <div class="chips"><button data-d="-100">−100</button><button data-d="-50">−50</button><button data-d="50">+50</button><button data-d="100">+100</button></div>
      <div class="row"><button class="px r" id="all" ${t.allin?'disabled':''}>كل شي أو لا شي</button><button class="px g" id="ok">راهن</button></div>
    </div></div>`;
  const draw=()=>{document.getElementById('amt').textContent=all?`ALL ${t.coins}`:v;
    const filled=Math.round((all?1:v/Math.max(t.coins,1))*10);
    document.getElementById('mt').innerHTML=Array.from({length:10},(_,k)=>`<i class="${k<filled?'':'off'}"></i>`).join('');
    document.getElementById('all').textContent=all?'إلغاء كل شي':'كل شي أو لا شي'};
  draw();
  app.querySelector('.chips').onclick=e=>{const d=+e.target.dataset.d;if(!d||all)return;v=Math.min(t.coins,Math.max(Math.min(MINBET,t.coins),v+d));SFX.tap();draw()};
  document.getElementById('all').onclick=()=>{all=!all;SFX.tap();draw()};
  document.getElementById('ok').onclick=()=>{
    G.bids[i]=all?t.coins:v;G.allin[i]=all;SFX.tap();
    app.innerHTML=`${header()}<div class="stage"><p class="hidebid">****</p><p class="k">${esc(t.name)} راهنوا ✓</p>
      <button class="px" id="n">${i===0?`دور ${esc(G.teams[1].name)}`:'اكشف الرهانات'}</button></div>`;
    document.getElementById('n').onclick=()=>i===0?bet(1):reveal();
  };
}

function reveal(){
  let c=3;
  const show=()=>{app.innerHTML=`${header()}<div class="stage"><p class="k">الرهانات تنكشف بعد</p><p class="count" key="${c}">${c}</p></div>`;beep(440,.12)};
  show();stopTimer();
  T=setInterval(()=>{c--;if(c>0)show();else{stopTimer();revealNow()}},800);
}
function revealNow(){
  const [a,b]=G.bids; let w;
  if(a===b)w=Math.random()<.5?0:1; else w=a>b?0:1;
  G.winner=w;
  const pad=i=>`<div class="paddle ${i===w?'win':'lose'}"><div class="p ${i?'b':'a'}">${G.allin[i]?'ALL':G.bids[i]}</div><div class="s"></div><em>${esc(G.teams[i].name)}</em></div>`;
  app.innerHTML=`${header()}<div class="stage"><div class="paddles">${pad(0)}${pad(1)}</div>
    <p class="k">${a===b?'تعادل! القرعة اختارت ':''}🔨 بيع على ${esc(G.teams[w].name)}!</p>
    <button class="px g" id="q">اعرض السؤال</button></div>`;
  SFX.win();
  document.getElementById('q').onclick=()=>question(w,false);
}

function question(team,steal,gone){
  const [cat,q,opts,right]=G.cur, t=G.teams[team];
  const stake=G.allin[G.winner]&&!steal?G.bids[G.winner]*2:G.bids[G.winner];
  let left=steal?STEAL_S:ANSWER_S, total=left;
  const cols=['var(--yellow)','var(--blue)','var(--red)','var(--green)'], letters=['A','B','C','D'];
  app.innerHTML=`${header(team)}<div class="stage">
    ${steal?`<p class="steal">فرصة سرقة! ${esc(t.name)}</p>`:''}
    <p class="q">${esc(q)}</p>
    <div class="opts" id="ops">${opts.map((o,k)=>`<button class="opt ${k===gone?'gone':''}" data-k="${k}" ${k===gone?'disabled':''} style="background:${cols[k]};${k===1||k===2?'color:var(--ink)':''}"><i>${letters[k]}</i>${esc(o)}</button>`).join('')}</div>
    <div class="row" style="align-items:center"><div class="tm"><b id="sec">${left}</b><div class="bars" id="bars"></div></div>
    <p class="stake">${steal?`STEAL: +${stake}`:`WIN: +${stake} · LOSE: −${stake}`}</p></div></div>`;
  const bars=()=>{const on=Math.ceil(left/total*10);document.getElementById('bars').innerHTML=Array.from({length:10},(_,k)=>`<i class="${k<on?'':'off'}"></i>`).join('');
    const s=document.getElementById('sec');s.textContent=left;s.classList.toggle('alarm',left<=5)};
  bars();
  stopTimer();
  T=setInterval(()=>{left--;if(left<=5&&left>0)SFX.tick();if(left<=0){stopTimer();answer(-1)}else bars()},1000);
  document.getElementById('ops').onclick=e=>{const b=e.target.closest('.opt');if(!b||b.disabled)return;stopTimer();answer(+b.dataset.k)};
  function answer(k){
    [...document.querySelectorAll('.opt')].forEach((b,j)=>{b.disabled=true;if(j===right)b.classList.add('right');else if(j===k)b.classList.add('wrong')});
    const ok=k===right;
    setTimeout(()=>result(team,steal,ok,k,stake),1100);
  }
}

function countUp(i,from,to){
  const el=app.querySelectorAll('.bar .team b')[i]; if(!el||from===to)return;
  const steps=18; let k=0; el.textContent=from; el.classList.add('pop');
  const id=setInterval(()=>{k++;el.textContent=Math.round(from+(to-from)*k/steps);if(k%3===0)beep(700+k*20,.03,'square',.025);if(k>=steps)clearInterval(id)},45);
}
function burst(){
  const cols=['var(--yellow)','var(--green)','var(--blue)','var(--red)','var(--purple)'];
  for(let i=0;i<40;i++){const p=document.createElement('i');p.className='pix';p.style.left=Math.random()*100+'%';p.style.top=(-10-Math.random()*30)+'%';
    p.style.background=cols[i%cols.length];p.style.animationDuration=(1.4+Math.random()*1.6)+'s';p.style.boxShadow='3px 3px 0 #000';app.appendChild(p);setTimeout(()=>p.remove(),3200)}
}
function fx(cls){app.classList.remove('shake','flash');void app.offsetWidth;app.classList.add(cls)}
function result(team,steal,ok,picked,stake){
  const t=G.teams[team], o=G.teams[1-team], before=t.coins;
  if(G.allin[team]&&!steal)t.allin=true;
  let line, color, amount;
  if(ok){t.coins+=stake;amount='+'+stake;color='var(--green)';line=steal?`${esc(t.name)} سرقوها!`:`صح! ${esc(t.name)} كسبوا`;SFX.win()}
  else if(!steal){t.coins=Math.max(0,t.coins-stake);amount='−'+stake;color='var(--red)';line=picked<0?`خلص الوقت! ${esc(t.name)} خسروا`:`غلط! ${esc(t.name)} خسروا`;SFX.lose()}
  else{amount='0';color='var(--mute)';line=`ولا ${esc(t.name)} عرفوها`;SFX.lose()}
  const canSteal=!ok&&!steal;
  const ans=G.cur[2][G.cur[3]];
  app.innerHTML=`${header()}<div class="stage">
    <p class="big" style="color:${color}">${amount}</p>
    <p class="k">${line}</p>
    ${!canSteal?`<p class="mute">الجواب: <b style="color:var(--ink)">${esc(ans)}</b></p>`:''}
    <div class="row">${canSteal?`<button class="px r" id="st">${esc(o.name)} يسرقون؟</button><button class="px d" id="skip">لا، التالي</button>`:`<button class="px g" id="nx">${G.round>=ROUNDS?'النتيجة النهائية':'السؤال الجاي'}</button>`}</div></div>`;
  countUp(team,before,t.coins);
  if(ok){fx('flash');if(stake>=400)burst()}else fx('shake');
  if(canSteal){
    document.getElementById('st').onclick=()=>{G.bids[G.winner]=stake;question(1-team,true,picked>=0?picked:undefined)};
    document.getElementById('skip').onclick=nextRound;
  }else document.getElementById('nx').onclick=nextRound;
}

function gameOver(){
  stopTimer();
  const [a,b]=G.teams; const w=a.coins===b.coins?null:(a.coins>b.coins?a:b);
  app.innerHTML=`<div class="stage">
    <p class="k blink">GAME OVER</p>
    <p class="cat">${w?`${esc(w.name)} فازوا!`:'تعادل!'}</p>
    <div class="final">${G.teams.map((t,i)=>`<div class="team ${i?'b':'a'}"><small>${esc(t.name)}</small><b>${t.coins}</b></div>`).join('')}</div>
    <div class="row"><button class="px g" id="again">لعبة جديدة</button></div></div>`;
  tune([523,523,659,784,659,784,1046],.12);
  burst();setTimeout(burst,900);
  document.getElementById('again').onclick=title;
}

title();
</script>
