<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>المزاد · جوالك</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lalezar&family=Press+Start+2P&family=IBM+Plex+Sans+Arabic:wght@500;700&display=swap">
<link rel="stylesheet" href="style.css">
<style>
body{margin:0}
#wrap{max-width:480px}
#app{min-height:calc(100vh - 90px);min-height:calc(100dvh - 90px)}
.field{display:flex;flex-direction:column;gap:6px;width:100%;text-align:start}
.field span{font-family:var(--pixel);font-size:.55rem;color:var(--mute)}
.field input{font:inherit;font-family:var(--display);font-size:1.6rem;color:var(--ink);background:var(--black);border:4px solid var(--ink);box-shadow:5px 5px 0 var(--purple);padding:6px 12px;width:100%;box-sizing:border-box;text-align:center}
#code{font-family:var(--pixel);font-size:1.4rem;letter-spacing:.3em;text-transform:uppercase;direction:ltr}
.pick{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%}
.pick button{font:inherit;font-family:var(--display);font-size:1.4rem;color:var(--ink);border:4px solid var(--ink);box-shadow:5px 5px 0 var(--black);padding:14px 0;cursor:pointer}
.pick button.sel{outline:4px dashed var(--yellow);outline-offset:4px}
.me{display:flex;justify-content:space-between;align-items:center;width:100%}
.me .team{min-width:0}
.abcd{display:grid;grid-template-columns:1fr 1fr;gap:14px;width:100%;flex:1;min-height:300px}
.abcd button{font:inherit;font-family:var(--display);font-size:3rem;border:4px solid var(--ink);box-shadow:6px 6px 0 var(--black);cursor:pointer;color:var(--black)}
.abcd button small{display:block;font-size:1.1rem;line-height:1.2}
.abcd button:disabled{opacity:.2}
.abcd button.chosen{outline:6px solid var(--ink);outline-offset:3px}
.err{color:var(--red);font-weight:700;min-height:1.5em}
</style>
</head>
<body>
<div id="wrap">
  <div class="crt">
    <div id="app"></div>
    <div class="knobs"><i></i><button id="snd" type="button">SOUND: ON</button><span class="modebadge" id="mode" style="font-family:var(--pixel);font-size:.5rem;color:var(--mute)"></span><i></i></div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="net.js"></script>
<script src="common.js"></script>
<script src="play.js"></script>
</body>
</html>
