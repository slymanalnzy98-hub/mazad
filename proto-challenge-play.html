<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>تجربة ٣: تحدّاني · جوالك</title>
<style>
/* نموذج تجريبي لاختبار المتعة فقط */
:root{--bg:#14142b;--ink:#fff;--mute:#9a9ac4;--a:#2f80ed;--b:#eb5757;--ok:#3ddc84;--bad:#ff5a5a;--y:#ffd23f}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Tahoma,"Segoe UI",sans-serif;display:flex;flex-direction:column;padding:12px max(12px,env(safe-area-inset-right)) 12px max(12px,env(safe-area-inset-left))}
.bar{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;border-radius:10px;font-weight:700}
.bar b{font-size:1.6rem}
.a{background:var(--a)}.b{background:var(--b)}
main{flex:1;display:flex;flex-direction:column;gap:12px;justify-content:center;text-align:center}
p{margin:0}
.mid{font-size:1.3rem;font-weight:700}
.mute{color:var(--mute)}
.huge{font-size:3.4rem;font-weight:900}
button{font:inherit;font-weight:900;border:0;border-radius:16px;cursor:pointer;color:#000;touch-action:manipulation}
button:disabled{opacity:.25}
.abcd{display:grid;grid-template-columns:1fr 1fr;gap:12px;flex:1}
.abcd button{font-size:1.15rem;padding:10px;min-height:110px;background:#fff}
.abcd button b{display:block;font-size:2rem}
.calls{display:grid;gap:14px;flex:1}
.calls button{font-size:2.6rem;min-height:120px}
.liar{background:var(--bad);color:#fff}.trust{background:var(--ok)}
input{font:inherit;font-size:1.4rem;padding:12px;border-radius:12px;border:0;width:100%;text-align:center}
.pick{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pick button{padding:18px;font-size:1.3rem;color:#fff}
.pick button.sel{outline:4px solid var(--y);outline-offset:3px}
.go{background:var(--ok);padding:16px;font-size:1.5rem}
.err{color:#ff8a8a;min-height:1.4em}
</style>
</head>
<body>
<div id="bar"></div>
<main id="app"></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js?v=8"></script>
<script src="net.js?v=8"></script>
<script src="auth.js?v=8"></script>
<script src="common.js?v=8"></script>
<script>
const app = document.getElementById('app'), barEl = document.getElementById('bar');
const $ = id => document.getElementById(id), L = 'أبجد';
let ID, sign, net, S = null, ME = { name: '', team: null, room: '' }, seq = Date.now(), lastKey = '', done = '';

async function act(body) { seq = Math.max(seq + 1, Date.now()); const m = { t: 'act', room: ME.room, id: ID.id, seq, body }; m.sig = await sign(Auth.actParts(m)); net.send(m); }
async function join() { const m = { t: 'join', room: ME.room, id: ID.id, name: ME.name, team: ME.team, pub: ID.pub }; m.sig = await sign(Auth.joinParts(m)); net.send(m); }

function joinScreen(err) {
  let team = ME.team;
  app.innerHTML = `<p class="huge">تحدّاني</p>
    <input id="code" maxlength="5" placeholder="رمز الغرفة" value="${esc(new URLSearchParams(location.search).get('room') || '')}" autocapitalize="characters">
    <input id="nm" maxlength="14" placeholder="اسمك" value="${esc(ME.name)}">
    <div class="pick" id="pk"><button class="a" data-t="0">الصقور</button><button class="b" data-t="1">النمور</button></div>
    <p class="err" id="er">${esc(err || '')}</p><button class="go" id="go">دخول</button>`;
  const mark = () => document.querySelectorAll('#pk button').forEach(b => b.classList.toggle('sel', +b.dataset.t === team));
  $('pk').onclick = e => { const b = e.target.closest('button'); if (b) { team = +b.dataset.t; mark(); } };
  $('go').onclick = async () => {
    const room = $('code').value.trim().toUpperCase(), name = $('nm').value.trim();
    if (room.length < 4) return $('er').textContent = 'اكتب رمز الغرفة';
    if (!name) return $('er').textContent = 'اكتب اسمك';
    if (team === null) return $('er').textContent = 'اختر فريقك';
    ME = { room, name, team }; $('er').textContent = 'جاري الاتصال…';
    try { net = await Net.open(room, onMsg, st => { if (st === 'up') { join(); net.send({ t: 'hello', room }); } }); }
    catch (e) { return $('er').textContent = 'ما قدرنا نتصل'; }
    await join(); wait('ننتظر الشاشة…');
  };
}
const wait = t => { app.innerHTML = `<p class="mid">${t}</p>`; };

function onMsg(m) {
  if (!m || m.t !== 'state' || m.room !== ME.room) return;
  S = m;
  if (S.phase === 'lobby' && !(S.players[ME.team] || []).includes(ME.name)) join();
  const t = ME.team;
  barEl.innerHTML = `<div class="bar ${t ? 'b' : 'a'}"><span>${esc(S.names[t])} · ${esc(ME.name)}</span><b>${S.coins[t]}</b></div>`;
  const key = [S.phase, S.round, S.coins.join()].join('|');
  if (key === lastKey) { const l = $('left'); if (l) l.textContent = S.left; return; }
  lastKey = key; render();
}

function render() {
  const t = ME.team, o = 1 - t, mine = S.answering === t, step = S.phase + S.round;
  switch (S.phase) {
    case 'lobby': return wait('دخلت! انتظروا الشاشة تبدأ');
    case 'answer': {
      if (!mine) return wait(`${esc(S.names[o])} يجاوبون بالسر… راقبوا وجيههم 👀`);
      if (done === step) return wait('جاوبتوا ✓ الحين اقنعوهم إنكم صح… أو خلّوهم يشكون 😏');
      app.innerHTML = `<p class="mid">جاوبوا بالسر · <span id="left">${S.left}</span></p><p class="mute">السؤال على الشاشة. الفريق الثاني ما يشوف جوابكم</p>
        <div class="abcd" id="ab">${S.opts.map((x, k) => `<button data-k="${k}"><b>${L[k]}</b>${esc(x)}</button>`).join('')}</div>`;
      $('ab').onclick = e => { const b = e.target.closest('button'); if (!b) return; done = step; act({ type: 'answer', k: +b.dataset.k }); beep(700, .05); render(); };
      return;
    }
    case 'call': {
      if (mine) return wait('الفريق الثاني يقرر… 😬 اقنعوهم!');
      if (done === step) return wait('قررتوا ✓ طالعوا الشاشة');
      app.innerHTML = `<p class="mid">جاوبوا صح ولا يكذبون؟ · <span id="left">${S.left}</span></p>
        <div class="calls"><button class="liar" id="lr">كذاب!</button><button class="trust" id="tr">صدقنا</button></div>`;
      const go = liar => { done = step; act({ type: 'call', liar }); beep(liar ? 300 : 600, .1); render(); };
      $('lr').onclick = () => go(true); $('tr').onclick = () => go(false);
      return;
    }
    case 'reveal': { const d = S.last.d[t]; return wait(`<span class="huge" style="color:${d > 0 ? 'var(--ok)' : d < 0 ? '#ff8a8a' : 'var(--mute)'}">${d > 0 ? '+' : ''}${d}</span><br>الجواب: ${esc(S.last.answer)}`); }
    case 'over': return wait(`<span class="huge">${S.coins[t] > S.coins[o] ? 'فزتوا! 🏆' : S.coins[t] < S.coins[o] ? 'خسرتوا' : 'تعادل'}</span>`);
  }
}

(async () => {
  try { ID = JSON.parse(sessionStorage.getItem('proto-id') || 'null'); } catch (e) {}
  if (!ID) { ID = await Auth.createIdentity(); try { sessionStorage.setItem('proto-id', JSON.stringify(ID)); } catch (e) {} }
  sign = await Auth.signer(ID);
  joinScreen();
  document.addEventListener('visibilitychange', () => { if (!document.hidden && net) { join(); net.send({ t: 'hello', room: ME.room }); } });
})();
</script>
</body>
</html>
