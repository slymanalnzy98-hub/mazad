<title>سهرة رمضان</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@500;700&family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap">
<style>
/* Layout: one centered column like a phone passed around the majlis; night-sky ground, lantern-brass accent. Single dark look by choice. */
:root{
  --night:#0f1424; --panel:#1a2138; --line:#2c3657; --ink:#f3ecd9; --mute:#a9a68f;
  --brass:#e2b04a; --mint:#5fc9a4; --rose:#e2665a;
  --display:"Reem Kufi","IBM Plex Sans Arabic",Tahoma,sans-serif;
  --body:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--night);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background-image:radial-gradient(circle at 85% 6%,#2a3150 0,transparent 38%);}
#app{max-width:560px;margin:0 auto;padding-block:20px 48px;display:flex;flex-direction:column;gap:18px}
h1,h2{font-family:var(--display);margin:0;text-wrap:balance;line-height:1.25}
h1{font-size:2.4rem;color:var(--brass)}
h2{font-size:1.6rem}
p{margin:0}
.mute{color:var(--mute)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:12px}
button{font:inherit;font-weight:600;border:0;border-radius:12px;padding:14px 18px;cursor:pointer;background:var(--brass);color:#1b1505}
button.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
button.mint{background:var(--mint);color:#06281d}
button.rose{background:var(--rose);color:#2a0905}
button:focus-visible,input:focus-visible{outline:3px solid var(--mint);outline-offset:2px}
button:disabled{opacity:.4;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>button{flex:1 1 140px}
input{font:inherit;background:var(--night);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:12px;width:100%;box-sizing:border-box}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--night);border:1px solid var(--line);border-radius:999px;padding:6px 12px;display:inline-flex;gap:8px;align-items:center}
.chip b{cursor:pointer;color:var(--rose)}
.game{text-align:start;display:flex;flex-direction:column;gap:6px;padding:20px}
.game .t{font-family:var(--display);font-size:1.5rem;color:var(--brass)}
.secret{min-height:150px;justify-content:center;text-align:center;font-size:1.25rem}
.big{font-family:var(--display);font-size:2rem;color:var(--brass)}
.score{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.score div{background:var(--night);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.score b{display:block;font-size:1.8rem;font-variant-numeric:tabular-nums}
.opt{background:var(--night);color:var(--ink);border:1px solid var(--line);text-align:start}
.opt.ok{background:var(--mint);color:#06281d}
.opt.bad{background:var(--rose);color:#2a0905}
.timer{font-family:var(--display);font-size:3rem;text-align:center;font-variant-numeric:tabular-nums;color:var(--brass)}
.list{display:flex;flex-direction:column;gap:6px}
.list div{display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding:6px 0}
.tag{font-size:.8rem;letter-spacing:.04em;color:var(--mint)}
@media (prefers-reduced-motion:no-preference){.card{animation:in .25s ease}@keyframes in{from{transform:translateY(6px);opacity:.6}to{transform:none;opacity:1}}}
</style>

<div id="app" dir="rtl"></div>

<script>
const $=s=>document.querySelector(s);
const app=$('#app');
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// ---------- بنك الأسئلة (الدخيل) ----------
const Q=[
 ["كم عدد أيام شهر رمضان على الأكثر؟",["28","29","30","31"],2],
 ["وش اسم الوجبة اللي قبل الفجر؟",["الغبقة","السحور","الفطور","العشاء"],1],
 ["في أي شهر هجري يجي عيد الفطر؟",["رمضان","شعبان","شوال","ذو القعدة"],2],
 ["كم عدد مناطق المملكة الإدارية؟",["11","13","15","10"],1],
 ["وش أطول برج في جدة قيد الإنشاء؟",["برج المملكة / جدة","برج الفيصلية","أبراج البيت","برج رافال"],0],
 ["وين تقع مدائن صالح (الحِجر)؟",["تبوك","العُلا","حائل","نجران"],1],
 ["وش لون علم المملكة؟",["أحمر","أزرق","أخضر","أسود"],2],
 ["أي حلا يتسوّى من عجين يتقطّع ويتغمّس بالشيرة؟",["اللقيمات","المهلبية","الكنافة","الكليجا"],0],
 ["الكليجا مشهورة في أي منطقة؟",["القصيم","جازان","الباحة","الشرقية"],0],
 ["كم عدد الصلوات المفروضة في اليوم؟",["3","4","5","6"],2],
 ["وش يسمّون الأكلة الشعبية من القمح واللحم المطبوخ لين يصير ناعم؟",["الجريش","الهريس","المرقوق","القرصان"],1],
 ["عاصمة المملكة؟",["جدة","الدمام","الرياض","مكة"],2],
 ["أكبر صحراء في المملكة؟",["الدهناء","الربع الخالي","النفود","الصمان"],1],
 ["في أي سنة ميلادية تأسست الدولة السعودية الأولى؟",["1727","1902","1932","1818"],0],
 ["وش اسم القهوة الخفيفة الصفرا اللي تنقدّم مع التمر؟",["القهوة التركية","القهوة السعودية","الإسبريسو","الموكا"],1],
 ["كم شوط في الطواف؟",["5","6","7","3"],2],
 ["المسحّراتي وش شغلته؟",["يوزّع الفطور","يصحّي الناس للسحور","يأذّن","يبيع الحلا"],1],
 ["زكاة الفطر تُخرج متى؟",["أول رمضان","قبل صلاة العيد","بعد العيد بأسبوع","نص رمضان"],1],
 ["أي مدينة يسمونها عروس البحر الأحمر؟",["ينبع","جدة","أملج","جازان"],1],
 ["السمبوسة تتعبّى غالباً بـ؟",["فواكه","لحم أو جبن","رز","تمر"],1],
 ["كم عدد أركان الإسلام؟",["4","5","6","7"],1],
 ["وش أشهر تمر في المدينة المنورة؟",["السكري","العجوة","الخلاص","الصقعي"],1],
 ["الغبقة وجبة مشهورة في؟",["الخليج","المغرب","مصر","الشام"],0],
 ["كم دقيقة في الساعة؟",["50","60","100","30"],1]
];
// Fix one dubious item: replace Jeddah tower question with a safer one
Q[4]=["أي نوع شاي ينطبخ مع الهيل والزعفران عادةً؟",["الشاي العدني","الشاي الأخضر","الماتشا","شاي الثلج"],0];

// ---------- مهام السفرة ----------
const M=[
 "خلّ {t} يقول كلمة «تمر»",
 "خلّ {t} يذكر اسم أكلة رمضانية",
 "خلّ {t} يضحك على نكتة تقولها",
 "خلّ {t} يقول «يا شيخ»",
 "خلّ {t} يسألك سؤال",
 "خلّ {t} يقول وش أكل اليوم على الفطور",
 "خلّ {t} يوقف من مكانه",
 "خلّ {t} يقول «والله»",
 "خلّ {t} يذكر اسم مسلسل",
 "خلّ {t} يشرب شي",
 "خلّ {t} يقول رقم أكبر من 100",
 "خلّ {t} يمدحك",
 "خلّ {t} يقول «صدق؟»",
 "خلّ {t} يذكر اسم مدينة",
 "خلّ {t} يطالع جواله",
 "خلّ {t} يوافقك على رأي غريب",
 "خلّ {t} يقول اسمك",
 "خلّ {t} يعطيك شي بيده",
 "خلّ {t} يتكلم عن السفر",
 "خلّ {t} يقول «إن شاء الله»"
];

let S={players:[]};

function home(){
  app.innerHTML=`
  <header style="display:flex;flex-direction:column;gap:6px">
    <h1>سهرة رمضان</h1>
    <p class="mute">نسخة تجريبية. جوال واحد يتمرر بين اللاعبين.</p>
  </header>
  <div class="card">
    <h2>اللاعبين</h2>
    <form id="addf" class="row"><input id="pname" placeholder="اكتب اسم لاعب" autocomplete="off"><button style="flex:0 0 auto">إضافة</button></form>
    <div class="chips" id="chips"></div>
    <p class="mute" id="hint"></p>
  </div>
  <button class="card game" id="g1"><span class="t">الدخيل</span><span class="mute">فريقين وأسئلة، وفي كل فريق مخرّب سري يعرف الأجوبة. اكشفوه!</span><span class="tag">4 لاعبين أو أكثر</span></button>
  <button class="card game" id="g2"><span class="t">السفرة</span><span class="mute">كل واحد عنده مهمة سرية ينفّذها في السالفة. لا تنكشف!</span><span class="tag">3 لاعبين أو أكثر</span></button>`;
  const draw=()=>{
    $('#chips').innerHTML=S.players.map((p,i)=>`<span class="chip">${esc(p)} <b data-i="${i}" aria-label="حذف">×</b></span>`).join('');
    $('#hint').textContent=S.players.length?`${S.players.length} لاعبين`:'أضف أسماء اللاعبين أول.';
    $('#g1').disabled=S.players.length<4; $('#g2').disabled=S.players.length<3;
  };
  $('#addf').onsubmit=e=>{e.preventDefault();const v=$('#pname').value.trim();if(v&&!S.players.includes(v)){S.players.push(v);$('#pname').value='';draw()}$('#pname').focus()};
  $('#chips').onclick=e=>{if(e.target.dataset.i){S.players.splice(+e.target.dataset.i,1);draw()}};
  $('#g1').onclick=()=>dakheel();
  $('#g2').onclick=()=>sufra();
  draw();
}

// يمرر الجوال لكل لاعب ويكشف له سره
function reveal(list,done,i=0){
  if(i>=list.length)return done();
  const [name,html]=list[i];
  app.innerHTML=`<div class="card secret"><p class="mute">عطوا الجوال لـ</p><p class="big">${esc(name)}</p><button id="sh">اضغط وشوف سرّك</button></div>`;
  $('#sh').onclick=()=>{
    app.innerHTML=`<div class="card secret">${html}<button id="hd">خبّيته، مرر الجوال</button></div>`;
    $('#hd').onclick=()=>reveal(list,done,i+1);
  };
}

// ---------- الدخيل ----------
function dakheel(){
  const ps=shuffle(S.players), h=Math.ceil(ps.length/2);
  const G={teams:[ps.slice(0,h),ps.slice(h)],score:[0,0],round:0,qs:shuffle(Q)};
  newRound(G);
}
function newRound(G){
  G.round++;
  G.spy=G.teams.map(t=>t[Math.floor(Math.random()*t.length)]);
  G.cur=G.qs.splice(0,6); // 3 لكل فريق بالتناوب
  if(G.cur.length<6){G.qs=shuffle(Q);G.cur=G.qs.splice(0,6)}
  G.qi=0;
  const answers=G.cur.map((q,i)=>`<div><span>سؤال ${i+1}</span><b>${esc(q[1][q[2]])}</b></div>`).join('');
  const list=[];
  G.teams.forEach((t,ti)=>t.forEach(p=>{
    const spy=G.spy[ti]===p;
    list.push([p,spy
      ?`<p class="big" style="color:var(--rose)">أنت الدخيل</p><p>ضلّل فريقك بدون ما ينكشف أمرك. هذي الأجوبة الصح بالترتيب:</p><div class="list">${answers}</div>`
      :`<p class="big">لاعب عادي</p><p>أنت في <b>الفريق ${ti+1}</b>. فيه دخيل بينكم، انتبه!</p>`]);
  }));
  app.innerHTML=`<div class="card"><h2>الجولة ${G.round}</h2>
   <p>الفريق 1: ${G.teams[0].map(esc).join('، ')}</p>
   <p>الفريق 2: ${G.teams[1].map(esc).join('، ')}</p>
   <p class="mute">الحين نمرر الجوال على الكل عشان كل واحد يعرف دوره.</p>
   <button id="go">ابدأ توزيع الأدوار</button></div>`;
  $('#go').onclick=()=>reveal(list,()=>question(G));
}
function scoreHTML(G){return `<div class="score"><div>الفريق 1<b>${G.score[0]}</b></div><div>الفريق 2<b>${G.score[1]}</b></div></div>`}
function question(G){
  if(G.qi>=G.cur.length)return vote(G,0);
  const q=G.cur[G.qi], team=G.qi%2;
  app.innerHTML=`${scoreHTML(G)}<div class="card"><p class="tag">سؤال ${G.qi+1} من 6 · دور الفريق ${team+1}</p><h2>${esc(q[0])}</h2>
   <div class="list" id="opts" style="gap:8px">${q[1].map((o,i)=>`<button class="opt" data-i="${i}">${esc(o)}</button>`).join('')}</div>
   <p class="mute">تناقشوا، وبعدين اختاروا جواب واحد.</p></div>`;
  $('#opts').onclick=e=>{
    const i=e.target.dataset.i; if(i===undefined)return;
    const ok=+i===q[2];
    [...document.querySelectorAll('.opt')].forEach((b,j)=>{b.disabled=true;if(j===q[2])b.classList.add('ok');else if(j==i)b.classList.add('bad')});
    if(ok)G.score[team]+=100;
    const n=document.createElement('button');n.textContent=ok?'صح! +100 · التالي':'غلط · التالي';
    n.onclick=()=>{G.qi++;question(G)};
    $('#opts').after(n);
  };
}
function vote(G,ti){
  if(ti>1)return roundEnd(G);
  app.innerHTML=`${scoreHTML(G)}<div class="card"><h2>الفريق ${ti+1}: مين الدخيل؟</h2>
   <p class="mute">تناقشوا واتفقوا على اسم واحد.</p>
   <div class="list" id="vs" style="gap:8px">${G.teams[ti].map(p=>`<button class="opt" data-p="${esc(p)}">${esc(p)}</button>`).join('')}</div></div>`;
  $('#vs').onclick=e=>{
    const p=e.target.dataset.p; if(!p)return;
    const caught=p===G.spy[ti];
    if(caught)G.score[ti]+=200; else G.score[1-ti]+=200;
    app.innerHTML=`${scoreHTML(G)}<div class="card secret"><p class="mute">الدخيل كان</p><p class="big" style="color:var(--rose)">${esc(G.spy[ti])}</p>
     <p>${caught?`كشفتوه! +200 للفريق ${ti+1}`:`ما كشفتوه. +200 للفريق ${2-ti}`}</p><button id="nx">التالي</button></div>`;
    $('#nx').onclick=()=>vote(G,ti+1);
  };
}
function roundEnd(G){
  app.innerHTML=`${scoreHTML(G)}<div class="card"><h2>نهاية الجولة ${G.round}</h2>
   <div class="row"><button id="again">جولة جديدة بدخلاء جدد</button><button class="ghost" id="out">ارجع للقائمة</button></div></div>`;
  $('#again').onclick=()=>newRound(G); $('#out').onclick=home;
}

// ---------- السفرة ----------
function mission(G,p){
  const others=S.players.filter(x=>x!==p);
  const t=others[Math.floor(Math.random()*others.length)];
  const m=G.pool.length?G.pool.pop():(G.pool=shuffle(M)).pop();
  G.mis[p]=m.replace('{t}',`«${t}»`);
}
function sufra(){
  const G={pool:shuffle(M),mis:{},pts:Object.fromEntries(S.players.map(p=>[p,0])),end:0};
  S.players.forEach(p=>mission(G,p));
  app.innerHTML=`<div class="card"><h2>السفرة</h2>
   <p>كل واحد بيوصله مهمة سرية. نفّذها وأنتم تسولفون عادي.</p>
   <p class="mute">نفّذت؟ سجّلها (+2). تشك بأحد؟ اتّهمه: صح (+1 لك ومهمته تتبدّل)، غلط (−1).</p>
   <div class="row"><button data-m="10">10 دقايق</button><button data-m="15">15 دقيقة</button><button data-m="20">20 دقيقة</button></div></div>`;
  app.querySelector('.row').onclick=e=>{const m=e.target.dataset.m;if(!m)return;
    G.len=m*60000;
    reveal(S.players.map(p=>[p,`<p class="mute">مهمتك السرية</p><p class="big">${esc(G.mis[p])}</p>`]),()=>{G.end=Date.now()+G.len;table(G)});
  };
}
function board(G){return `<div class="list">${Object.entries(G.pts).sort((a,b)=>b[1]-a[1]).map(([p,v])=>`<div><span>${esc(p)}</span><b>${v}</b></div>`).join('')}</div>`}
function pick(title,list,cb){
  app.innerHTML=`<div class="card"><h2>${title}</h2><div class="list" id="pk" style="gap:8px">${list.map(p=>`<button class="opt" data-p="${esc(p)}">${esc(p)}</button>`).join('')}</div><button class="ghost" id="bk">رجوع</button></div>`;
  $('#pk').onclick=e=>{const p=e.target.dataset.p;if(p)cb(p)};
  return $('#bk');
}
function table(G){
  clearInterval(G.tick);
  app.innerHTML=`<div class="card"><div class="timer" id="tm"></div><p class="mute" style="text-align:center">خلّوا الجوال على الطاولة وسولفوا</p>
   <div class="row"><button class="mint" id="dn">نفّذت مهمتي</button><button class="rose" id="ac">أتّهم أحد</button></div>
   <button class="ghost" id="pk2">أبي أشوف مهمتي</button></div>
   <div class="card"><h2>النقاط</h2>${board(G)}</div>`;
  const tick=()=>{const r=Math.max(0,G.end-Date.now());const m=Math.floor(r/60000),s=Math.floor(r%60000/1000);
    const el=$('#tm'); if(el)el.textContent=`${m}:${String(s).padStart(2,'0')}`; if(!r){clearInterval(G.tick);finish(G)}};
  tick(); G.tick=setInterval(tick,500);
  const back=()=>table(G);
  $('#dn').onclick=()=>{clearInterval(G.tick);pick('مين نفّذ مهمته؟',S.players,p=>{
      app.innerHTML=`<div class="card secret"><p>${esc(p)}، تأكد إن الباقين شافوا إنك نفّذت:</p><p class="big">${esc(G.mis[p])}</p>
       <div class="row"><button class="mint" id="y">إيه، +2</button><button class="ghost" id="n">لا، رجوع</button></div></div>`;
      $('#y').onclick=()=>{G.pts[p]+=2;mission(G,p);reveal([[p,`<p class="mute">مهمتك الجديدة</p><p class="big">${esc(G.mis[p])}</p>`]],back)};
      $('#n').onclick=back;
    }).onclick=back};
  $('#ac').onclick=()=>{clearInterval(G.tick);pick('مين يتّهم؟',S.players,a=>{
      pick(`${esc(a)} يتّهم مين؟`,S.players.filter(x=>x!==a),d=>{
        app.innerHTML=`<div class="card secret"><p>${esc(a)} يقول إن مهمة ${esc(d)} هي:</p><p class="mute">قلها بصوت عالي، وبعدين ${esc(d)} يكشف مهمته</p><button id="rv">اكشف مهمة ${esc(d)}</button></div>`;
        $('#rv').onclick=()=>{
          app.innerHTML=`<div class="card secret"><p class="mute">مهمة ${esc(d)}</p><p class="big">${esc(G.mis[d])}</p><p>هل ${esc(a)} عرفها؟</p>
           <div class="row"><button class="mint" id="y">عرفها</button><button class="rose" id="n">ما عرفها</button></div></div>`;
          $('#y').onclick=()=>{G.pts[a]+=1;mission(G,d);reveal([[d,`<p class="mute">انكشفت! مهمتك الجديدة</p><p class="big">${esc(G.mis[d])}</p>`]],back)};
          $('#n').onclick=()=>{G.pts[a]-=1;back()};
        };
      }).onclick=back;
    }).onclick=back};
  $('#pk2').onclick=()=>{clearInterval(G.tick);pick('مين يبي يشوف مهمته؟',S.players,p=>reveal([[p,`<p class="mute">مهمتك</p><p class="big">${esc(G.mis[p])}</p>`]],back)).onclick=back};
}
function finish(G){
  const top=Object.entries(G.pts).sort((a,b)=>b[1]-a[1])[0];
  app.innerHTML=`<div class="card secret"><p class="mute">انتهى الوقت! الفائز</p><p class="big">${esc(top[0])}</p></div>
   <div class="card"><h2>النقاط</h2>${board(G)}<div class="row"><button id="ag">لعبة جديدة</button><button class="ghost" id="hm">القائمة</button></div></div>`;
